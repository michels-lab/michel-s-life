<!-- v3.0.202 hotfix: verified UI stability fixes for About, notifications, branding and legal line -->
<style id="mlv-v30202-ui-hotfix-style">
#v30171Sidebar .v30171-brand-mark.mlv203-brand-mark{
  width:72px!important;height:72px!important;border-radius:22px!important;padding:0!important;
  background:transparent!important;border:0!important;box-shadow:none!important;overflow:visible!important;
}
#v30171Sidebar .v30171-brand-mark.mlv203-brand-mark img{
  width:72px!important;height:72px!important;display:block!important;object-fit:contain!important;
  filter:drop-shadow(0 8px 18px rgba(0,0,0,.28));
}
#v30171Sidebar .mlv203-brand-legal{
  margin-top:7px!important;max-width:190px!important;color:var(--muted)!important;
  font:600 7.2px/1.35 Inter,Segoe UI,Arial,sans-serif!important;letter-spacing:.025em!important;
  text-transform:none!important;opacity:.78!important;text-align:center!important;
}
#v30171Sidebar .mlv203-brand-legal b{font-weight:760!important;color:color-mix(in srgb,var(--text) 72%,var(--muted))!important}
[data-v30171-pane="about"].active{align-content:start!important}
[data-v30171-pane="about"]>[data-mlv-developer]{display:block!important;visibility:visible!important;opacity:1!important}
#toastWrap .toast[data-mlv203-toast-key]{position:relative}
@media(max-width:1100px){
  #v30171Sidebar .v30171-brand-mark.mlv203-brand-mark,#v30171Sidebar .v30171-brand-mark.mlv203-brand-mark img{width:56px!important;height:56px!important}
  #v30171Sidebar .mlv203-brand-legal{font-size:6.8px!important;max-width:170px!important}
}
</style>
<script id="mlv-v30202-ui-hotfix-script">
(function(){
'use strict';
if(window.MLV202UIHotfix)return;
const VERSION='3.0.202-hotfix';
const LEGAL='© 2026 Michel Duarte / Michel’s Lab. All rights reserved.';
const dismissed=new Set();

function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toastKey(title,msg){return (String(title||'').trim()+'\n'+String(msg||'').trim()).toLowerCase()}
function existingToast(key){return [...document.querySelectorAll('#toastWrap .toast[data-mlv203-toast-key]')].find(x=>x.dataset.mlv203ToastKey===key)||null}
function decorateToast(div,key){
  if(!(div instanceof Element))return div;
  div.dataset.mlv203ToastKey=key;
  const close=div.querySelector('.mlv197-toast-close,button[aria-label="Dismiss"],button[aria-label="Close"]');
  if(close&&!close.dataset.mlv203Dismiss){
    close.dataset.mlv203Dismiss='1';
    close.addEventListener('click',()=>dismissed.add(key),{capture:true,once:true});
  }
  return div;
}
function installNotificationGuard(){
  const api=window.MLV197Reliability;
  if(api?.notification&&!api.notification.__mlv203){
    const original=api.notification;
    const wrapped=function(title,msg='',opts={}){
      const key=toastKey(title,msg);
      if(dismissed.has(key))return null;
      const old=existingToast(key);if(old)return old;
      return decorateToast(original(title,msg,opts),key);
    };
    wrapped.__mlv203=true;api.notification=wrapped;
  }
  if(typeof window.toast==='function'&&!window.toast.__mlv203){
    const original=window.toast;
    const wrapped=function(title,msg='',kind=''){
      const key=toastKey(title,msg);
      if(dismissed.has(key))return null;
      const old=existingToast(key);if(old)return old;
      return decorateToast(original(title,msg,kind),key);
    };
    wrapped.__mlv203=true;window.toast=wrapped;
  }
  document.querySelectorAll('#toastWrap .toast').forEach(div=>{
    const b=div.querySelector('b')?.textContent||'';
    const span=div.querySelector('span')?.textContent||'';
    const key=toastKey(b,span);
    if(!div.dataset.mlv203ToastKey)decorateToast(div,key);
  });
}

function enhanceBrand(){
  const brand=document.querySelector('#v30171Sidebar .v30171-brand');if(!brand)return false;
  const mark=brand.querySelector('.v30171-brand-mark');
  if(mark&&!mark.classList.contains('mlv203-brand-mark')){
    mark.classList.add('mlv203-brand-mark');
    mark.innerHTML='<img src="assets/michels_life_mark.svg" alt="" aria-hidden="true">';
  }
  const copy=brand.querySelector('.v30171-brand-title')?.parentElement;
  if(copy&&!copy.querySelector('.mlv203-brand-legal')){
    const legal=document.createElement('div');legal.className='mlv203-brand-legal';legal.innerHTML='<b>© 2026 Michel Duarte / Michel’s Lab.</b><br>All rights reserved.';copy.appendChild(legal);
  }
  return !!mark;
}

function developerFallback(){
  return `<section class="card mlvdev-card" data-mlv-developer data-mlv203-fallback><div class="mlvdev-head"><div class="mlvdev-avatar-wrap"><img class="mlvdev-avatar" src="assets/michel_duarte_avatar.jpg" alt="Michel Duarte"></div><div class="mlvdev-title"><h2>Michel Duarte</h2><p>Developer · Michel’s Lab</p></div></div><div class="mlvdev-copy">Michel’s Life is created and maintained by Michel Duarte under Michel’s Lab. Independent software focused on productivity, life systems and personal tools.</div><div class="mlvdev-contact">Contact: <a href="mailto:realmichelduarte@gmail.com">realmichelduarte@gmail.com</a></div><div class="mlvdev-socials"><a class="mlvdev-social" href="https://www.instagram.com/realmichelduarte/" target="_blank" rel="noopener noreferrer"><span><strong>Instagram</strong><small>@realmichelduarte</small></span></a><a class="mlvdev-social" href="https://www.facebook.com/realmichelduarte" target="_blank" rel="noopener noreferrer"><span><strong>Facebook</strong><small>realmichelduarte</small></span></a><a class="mlvdev-social" href="https://www.linkedin.com/in/realmichelduart/" target="_blank" rel="noopener noreferrer"><span><strong>LinkedIn</strong><small>realmichelduart</small></span></a><a class="mlvdev-social" href="https://github.com/realmichelduarte" target="_blank" rel="noopener noreferrer"><span><strong>GitHub</strong><small>realmichelduarte</small></span></a><a class="mlvdev-social" href="mailto:realmichelduarte@gmail.com"><span><strong>Email</strong><small>realmichelduarte@gmail.com</small></span></a></div><div class="mlvdev-legal">Free for personal use. Unauthorized copying, modification, redistribution, rebranding, resale, sublicensing, or claiming this software as your own is not permitted without prior written permission.<span class="mlvdev-copyright">${esc(LEGAL)}</span></div></section>`;
}
function ensureAbout(){
  if(String(window.state?.activeTab||'')!=='settings')return false;
  const root=document.getElementById('tab-settings');if(!root)return false;
  const btn=root.querySelector('[data-v30171-setting="about"]');
  const pane=root.querySelector('[data-v30171-pane="about"]');
  if(!btn||!pane)return false;
  root.querySelectorAll('[data-v30171-setting]').forEach(x=>x.classList.toggle('active',x===btn));
  root.querySelectorAll('[data-v30171-pane]').forEach(x=>x.classList.toggle('active',x===pane));
  try{localStorage.setItem('michelsLife.settingsSection.v30171','about')}catch(_){}
  try{window.MLVDeveloperBranding?.mount?.()}catch(err){console.warn('v3.0.202 hotfix developer mount',err)}
  try{window.MLV202ReleaseReadiness?.mount?.()}catch(err){console.warn('v3.0.202 hotfix release mount',err)}
  if(!pane.querySelector('[data-mlv-developer]')){
    const t=document.createElement('template');t.innerHTML=developerFallback();pane.appendChild(t.content.firstElementChild);
  }
  return !!pane.querySelector('[data-mlv-developer]');
}
function aboutRequested(){
  [0,50,180,500].forEach(ms=>setTimeout(()=>{ensureAbout();enhanceBrand();installNotificationGuard()},ms));
}

document.addEventListener('click',e=>{
  if(e.target.closest?.('[data-v30171-setting="about"]'))aboutRequested();
},true);

let timer=0;
const mo=new MutationObserver(()=>{
  clearTimeout(timer);timer=setTimeout(()=>{
    enhanceBrand();installNotificationGuard();
    const pane=document.querySelector('[data-v30171-pane="about"].active');
    if(pane)ensureAbout();
  },60);
});
try{mo.observe(document.body,{childList:true,subtree:true})}catch(_){}

installNotificationGuard();enhanceBrand();
setTimeout(()=>{installNotificationGuard();enhanceBrand();const pane=document.querySelector('[data-v30171-pane="about"].active');if(pane)ensureAbout()},250);
setTimeout(()=>{installNotificationGuard();enhanceBrand();const pane=document.querySelector('[data-v30171-pane="about"].active');if(pane)ensureAbout()},900);
window.MLV202UIHotfix={version:VERSION,ensureAbout,enhanceBrand,installNotificationGuard,dismissed};
})();
</script>
