<!-- reusable Michel's Lab developer branding -->
<style id="mlv-developer-branding-style">
.mlvdev-card{position:relative;overflow:hidden}.mlvdev-head{display:flex;align-items:center;gap:12px}.mlvdev-mark{flex:0 0 auto;width:58px;height:58px;border-radius:16px;display:grid;place-items:center;background:radial-gradient(circle at 35% 25%,rgba(255,215,128,.18),rgba(5,20,48,.96) 62%);border:1px solid rgba(231,187,92,.3);box-shadow:0 8px 24px rgba(0,0,0,.22)}.mlvdev-mark svg{width:44px;height:44px}.mlvdev-title{min-width:0}.mlvdev-title h2{margin:0;font-size:16px}.mlvdev-title p{margin:3px 0 0;color:var(--muted);font-size:9.5px;line-height:1.4}.mlvdev-copy{margin-top:12px;color:var(--muted);font-size:9.5px;line-height:1.55}.mlvdev-socials{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}.mlvdev-social{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;text-decoration:none;color:inherit;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.025);transition:transform .15s ease,border-color .15s ease,background .15s ease}.mlvdev-social:hover{transform:translateY(-2px);border-color:rgba(231,187,92,.42);background:rgba(231,187,92,.07)}.mlvdev-social svg{width:20px;height:20px;display:block}.mlvdev-social span{font-weight:800;font-size:12px;letter-spacing:-.02em}.mlvdev-legal{margin-top:14px;padding-top:11px;border-top:1px solid rgba(255,255,255,.07);font-size:8.8px;line-height:1.5;color:var(--muted)}.mlvdev-copyright{display:block;margin-top:8px;color:rgba(255,255,255,.63);font-size:8.5px}
</style>
<script id="mlv-developer-branding">
(function(){
'use strict';
if(window.MLVDeveloperBranding)return;
const PROFILE={studio:"Michel’s Lab",developer:"Michel Duarte",email:"realmichelduarte@gmail.com",instagram:"https://www.instagram.com/realmichelduarte/",facebook:"https://www.facebook.com/realmichelduarte",linkedin:"https://www.linkedin.com/in/realmichelduart/",github:"https://github.com/realmichelduarte"};
function labMark(){return `<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="28" fill="#071a3b" stroke="#e7bb5c" stroke-width="2"/><path d="M24 15h16M28 15v13L18 46c-2 4 1 7 5 7h18c4 0 7-3 5-7L36 28V15" fill="none" stroke="#f2d58b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M23 43c6 4 12-4 18 0" fill="none" stroke="#e7bb5c" stroke-width="2.5" stroke-linecap="round"/><path d="M32 32l2.3 4.7L39 39l-4.7 2.3L32 46l-2.3-4.7L25 39l4.7-2.3L32 32z" fill="#fff0bd"/></svg>`}
function icon(kind){if(kind==='instagram')return `<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4.1" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.4" cy="6.8" r="1.2" fill="currentColor"/></svg>`;if(kind==='facebook')return '<span aria-hidden="true">f</span>';if(kind==='linkedin')return '<span aria-hidden="true">in</span>';if(kind==='github')return `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 .9A11.1 11.1 0 0 0 8.5 22.5c.55.1.75-.24.75-.53v-2.1c-3.05.67-3.7-1.3-3.7-1.3-.5-1.28-1.22-1.62-1.22-1.62-1-.69.08-.67.08-.67 1.1.08 1.68 1.14 1.68 1.14.98 1.68 2.57 1.2 3.2.91.1-.71.38-1.2.7-1.47-2.44-.28-5-1.22-5-5.43 0-1.2.43-2.18 1.13-2.95-.11-.28-.49-1.4.11-2.9 0 0 .92-.3 3.02 1.12a10.5 10.5 0 0 1 5.5 0c2.1-1.42 3.02-1.12 3.02-1.12.6 1.5.22 2.62.11 2.9.7.77 1.13 1.75 1.13 2.95 0 4.22-2.57 5.14-5.02 5.42.4.34.75 1.02.75 2.06v3.06c0 .29.2.64.76.53A11.1 11.1 0 0 0 12 .9z"/></svg>`;return `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5.5h18v13H3z" fill="none" stroke="currentColor" stroke-width="2"/><path d="m4 7 8 6 8-6" fill="none" stroke="currentColor" stroke-width="2"/></svg>`}
function social(href,kind,label){return `<a class="mlvdev-social" href="${href}" target="_blank" rel="noopener noreferrer" aria-label="${label}" title="${label}">${icon(kind)}</a>`}
function card(){return `<section class="card mlvdev-card" data-mlv-developer><div class="mlvdev-head"><div class="mlvdev-mark">${labMark()}</div><div class="mlvdev-title"><h2>Michel’s Lab</h2><p>Developed by Michel Duarte</p></div></div><div class="mlvdev-copy">Independent software lab creating productivity, life-system and personal tools. Michel’s Life is free to use; its code, branding, visual assets and distribution rights remain protected.</div><div class="mlvdev-socials">${social(PROFILE.instagram,'instagram','Instagram')}${social(PROFILE.facebook,'facebook','Facebook')}${social(PROFILE.linkedin,'linkedin','LinkedIn')}${social(PROFILE.github,'github','GitHub')}${social('mailto:'+PROFILE.email,'email','Email')}</div><div class="mlvdev-legal">Free for personal use. Unauthorized copying, modification, redistribution, rebranding, resale, sublicensing, or claiming this software as your own is not permitted without prior written permission.<span class="mlvdev-copyright">© 2026 Michel Duarte / Michel’s Lab. All rights reserved.</span></div></section>`}
function mount(){if(String(window.state?.activeTab||'')!=='settings')return;const pane=document.querySelector('[data-v30171-pane="about"]');if(!pane)return;let old=pane.querySelector('[data-mlv-developer]');const t=document.createElement('template');t.innerHTML=card();const el=t.content.firstElementChild;old?old.replaceWith(el):pane.appendChild(el)}
const mo=new MutationObserver(()=>{clearTimeout(mo._t);mo._t=setTimeout(mount,100)});try{mo.observe(document.body,{childList:true,subtree:true})}catch(_){}
document.addEventListener('click',e=>{if(e.target.closest?.('[data-v30171-setting="about"]'))setTimeout(mount,140)},true);
setTimeout(mount,800);
window.MLVDeveloperBranding={profile:PROFILE,mount};
})();
</script>
