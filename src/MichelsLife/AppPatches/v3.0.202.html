<!-- v3.0.202: release readiness / diagnostics / portable backup / GitHub update channel -->
<style id="mlv-v30202-release-readiness-style">
.mlv202-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}.mlv202-kpi{padding:10px;border:1px solid rgba(255,255,255,.08);border-radius:13px;background:rgba(255,255,255,.022)}.mlv202-kpi small{display:block;color:var(--muted);font-size:8.5px;text-transform:uppercase;letter-spacing:.07em}.mlv202-kpi b{display:block;margin-top:4px;font-size:11px}.mlv202-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.mlv202-note{margin-top:10px;color:var(--muted);font-size:9.5px;line-height:1.5}.mlv202-checks{display:grid;gap:6px;margin-top:11px}.mlv202-check{display:grid;grid-template-columns:10px minmax(120px,.7fr) minmax(0,1.7fr);gap:8px;align-items:start;padding:8px 9px;border:1px solid rgba(255,255,255,.065);border-radius:10px;background:rgba(255,255,255,.018)}.mlv202-dot{width:8px;height:8px;border-radius:50%;margin-top:4px;background:#7f8b99}.mlv202-check.ok .mlv202-dot{background:#66d49a}.mlv202-check.warning .mlv202-dot{background:#ffd166}.mlv202-check.error .mlv202-dot{background:#ff6b7a}.mlv202-check b{font-size:10px}.mlv202-check span{font-size:9px;color:var(--muted);line-height:1.4;overflow-wrap:anywhere}.mlv202-status.ok{color:#66d49a}.mlv202-status.warning{color:#ffd166}.mlv202-status.error{color:#ff6b7a}.mlv202-release-note{max-height:120px;overflow:auto;white-space:pre-wrap;padding:9px;border-radius:10px;border:1px solid rgba(255,255,255,.06);background:rgba(0,0,0,.12);font-size:9px;color:var(--muted);line-height:1.45;margin-top:9px}.mlv202-changelog{display:grid;gap:8px;margin-top:10px}.mlv202-change{padding:10px;border:1px solid rgba(255,255,255,.07);border-radius:12px;background:rgba(255,255,255,.018)}.mlv202-change b{font-size:10.5px}.mlv202-change ul{margin:7px 0 0 18px;padding:0;color:var(--muted);font-size:9.5px;line-height:1.5}
@media(max-width:800px){.mlv202-grid{grid-template-columns:1fr}.mlv202-check{grid-template-columns:10px 1fr}.mlv202-check span{grid-column:2}}
</style>
<script id="mlv-v30202-release-readiness-script">
(function(){
'use strict';
if(window.MLV202ReleaseReadiness)return;
const VERSION='3.0.202',CHANNEL='michels-life-google-calendar',RESPONSE='michels-life-google-calendar-response';
let seq=0,diag=null,diagBusy=false,update=null,updateBusy=false;const pending=new Map();
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notify(t,m='',o={}){try{return window.MLV197Reliability?.notification?.(t,m,o)||window.toast?.(t,m)}catch(_){}}
function bridge(action,payload={}){return new Promise((resolve,reject)=>{if(!window.chrome?.webview?.postMessage){reject(new Error('This action requires the Windows app.'));return}const requestId='mlv202-'+Date.now()+'-'+(++seq),timer=setTimeout(()=>{pending.delete(requestId);reject(new Error('Request timed out.'))},120000);pending.set(requestId,{resolve,reject,timer});window.chrome.webview.postMessage({channel:CHANNEL,requestId,action,payload})})}
if(window.chrome?.webview?.addEventListener)window.chrome.webview.addEventListener('message',ev=>{const d=ev?.data;if(!d||d.channel!==RESPONSE)return;const p=pending.get(d.requestId);if(!p)return;clearTimeout(p.timer);pending.delete(d.requestId);d.ok?p.resolve(d.payload):p.reject(new Error(d.error||'Request failed.'))});
function capture(){try{return window.GoogleCloudV30192?.capture?.()||window.GoogleCloudV30191?.capture?.()||''}catch(_){return''}}
function dataPane(){return document.querySelector('[data-v30171-pane="data"]')}function aboutPane(){return document.querySelector('[data-v30171-pane="about"]')}
function applyBackupJson(raw){const b=JSON.parse(raw),ls=b.localStorage&&typeof b.localStorage==='object'?b.localStorage:null,st=b.state&&typeof b.state==='object'?b.state:(b.runtimeState&&typeof b.runtimeState==='object'?b.runtimeState:null);if(!ls&&!st)throw new Error('This file does not contain a restorable Michel’s Life state.');localStorage.clear();if(ls)for(const [k,v] of Object.entries(ls))localStorage.setItem(k,String(v));if(st)localStorage.setItem('vida_rpg_personal_progress_v2',JSON.stringify(st));sessionStorage.setItem('mlv202Imported','1');location.reload()}
function diagCard(){const checks=Array.isArray(diag?.checks)?diag.checks:[];const overall=diag?.overall||'idle';return `<section class="card" data-mlv202-diagnostics><div class="section-title"><div><h2>App health & diagnostics</h2><p>Checks the installation without uploading your personal data.</p></div><span class="pill mlv202-status ${esc(overall)}">${diagBusy?'Checking…':overall==='idle'?'Not checked':esc(overall.toUpperCase())}</span></div><div class="mlv202-actions"><button class="btn" type="button" data-mlv202-action="diagnostics" ${diagBusy?'disabled':''}>${diagBusy?'Running…':'Run diagnostics'}</button><button class="btn ghost" type="button" data-mlv202-action="diagnostic-report">Save diagnostic snapshot</button><button class="btn ghost" type="button" data-mlv202-action="open-diagnostics">Open diagnostics folder</button></div>${checks.length?`<div class="mlv202-checks">${checks.map(x=>`<div class="mlv202-check ${esc(x.status)}"><i class="mlv202-dot"></i><b>${esc(x.name)}</b><span>${esc(x.detail)}</span></div>`).join('')}</div>`:'<div class="mlv202-note">Run diagnostics to verify WebView2, the visual bundle, storage permissions, backups, Google status and the update channel.</div>'}</section>`}
function portableCard(){return `<section class="card" data-mlv202-portable><div class="section-title"><div><h2>Portable backup</h2><p>Move the complete profile between PCs without depending on Google Drive.</p></div><span class="pill">.michelslife</span></div><div class="mlv202-actions"><button class="btn" type="button" data-mlv202-action="export-portable">Export .michelslife</button><button class="btn ghost" type="button" data-mlv202-action="import-portable">Import .michelslife</button></div><div class="mlv202-note">The file contains the restorable application state and local settings. OAuth tokens and internal technical logs are excluded. Import always creates a restore point of the current state first.</div></section>`}
function updateCard(){const u=update||{currentVersion:VERSION,onlineChannelConfigured:true};const online=!!u.onlineAvailable,local=!!u.candidatePath;return `<section class="card" data-mlv202-update><div class="section-title"><div><h2>Updates</h2><p>Local safe updates plus a GitHub Releases channel prepared for public distribution.</p></div><span class="pill gold">v${esc(u.currentVersion||VERSION)}</span></div><div class="mlv202-grid"><div class="mlv202-kpi"><small>Installed</small><b>v${esc(u.currentVersion||VERSION)}</b></div><div class="mlv202-kpi"><small>GitHub channel</small><b>${esc(u.onlineStatus||'Not checked')}</b></div><div class="mlv202-kpi"><small>Available</small><b>${online?'v'+esc(u.onlineVersion):local?'v'+esc(u.candidateVersion):'None detected'}</b></div></div><div class="mlv202-actions"><button class="btn" type="button" data-mlv202-action="check-update" ${updateBusy?'disabled':''}>${updateBusy?'Checking…':'Check for updates'}</button>${online?'<button class="btn primary" type="button" data-mlv202-action="install-online">Install GitHub update</button>':''}${local?'<button class="btn ghost" type="button" data-mlv202-action="install-local">Install local update</button>':''}<button class="btn ghost" type="button" data-mlv202-action="choose-local">Choose EXE…</button></div>${u.onlineReleaseNotes?`<div class="mlv202-release-note">${esc(u.onlineReleaseNotes)}</div>`:''}<div class="mlv202-note">Online builds are accepted only from the configured GitHub release channel and must include a SHA-256 checksum. A restore point is created before replacement.</div></section>`}
function changeCard(){return `<section class="card" data-mlv202-changelog><div class="section-title"><div><h2>What’s new</h2><p>Release-readiness work, not another visual redesign.</p></div><span class="pill">3.0.202</span></div><div class="mlv202-changelog"><div class="mlv202-change"><b>v3.0.202 · Release Readiness</b><ul><li>App diagnostics and local error reports.</li><li>Portable .michelslife export/import.</li><li>GitHub release channel with SHA-256 verification.</li><li>Personal account hardcodes removed from product logic.</li><li>Source/release workflow prepared for GitHub.</li></ul></div><div class="mlv202-change"><b>v3.0.201</b><ul><li>Unified Backup Timeline and safe restore previews.</li></ul></div><div class="mlv202-change"><b>v3.0.200</b><ul><li>First-run onboarding, safe local updater and weekly/monthly recaps.</li></ul></div></div></section>`}
function mount(){if(String(state?.activeTab||'')!=='settings')return;const d=dataPane(),a=aboutPane();if(d){let x=d.querySelector('[data-mlv202-portable]');const t=document.createElement('template');t.innerHTML=portableCard();x?x.replaceWith(t.content.firstElementChild):d.prepend(t.content.firstElementChild);x=d.querySelector('[data-mlv202-diagnostics]');const q=document.createElement('template');q.innerHTML=diagCard();x?x.replaceWith(q.content.firstElementChild):d.appendChild(q.content.firstElementChild)}if(a){a.querySelector('[data-mlv200-update]')?.remove();let x=a.querySelector('[data-mlv202-update]'),t=document.createElement('template');t.innerHTML=updateCard();x?x.replaceWith(t.content.firstElementChild):a.appendChild(t.content.firstElementChild);x=a.querySelector('[data-mlv202-changelog]');const q=document.createElement('template');q.innerHTML=changeCard();x?x.replaceWith(q.content.firstElementChild):a.appendChild(q.content.firstElementChild)}}
async function runDiag(){diagBusy=true;mount();try{diag=await bridge('diagnostics',{backupJson:capture()})}catch(e){notify('Diagnostics',String(e?.message||e),{kind:'error',persistent:true})}finally{diagBusy=false;mount()}}
async function checkUpdate(){updateBusy=true;mount();try{update=await bridge('updateStatus')}catch(e){notify('Update check',String(e?.message||e),{kind:'error',persistent:true})}finally{updateBusy=false;mount()}}
async function installOnline(){const u=update||await checkUpdate();if(!u?.onlineAvailable)return;if(!confirm(`Install Michel’s Life v${u.onlineVersion} from GitHub? A restore point will be created first.`))return;const backupJson=capture();if(!backupJson)throw new Error('Could not capture current state.');const r=await bridge('installOnlineUpdate',{backupJson,downloadUrl:u.onlineDownloadUrl,checksumUrl:u.onlineChecksumUrl,version:u.onlineVersion});notify('Update prepared',`v${r?.toVersion||u.onlineVersion} verified and ready. Michel’s Life will restart.`,{persistent:true})}
async function installLocal(path=''){if(!confirm('Install the newer local executable? A restore point will be created first.'))return;const backupJson=capture();if(!backupJson)throw new Error('Could not capture current state.');await bridge('installUpdate',{backupJson,candidatePath:path})}
document.addEventListener('click',async e=>{const b=e.target.closest?.('[data-mlv202-action]');if(!b)return;e.preventDefault();e.stopPropagation();const a=b.dataset.mlv202Action;try{if(a==='diagnostics')await runDiag();else if(a==='diagnostic-report'){const r=await bridge('createDiagnosticReport',{backupJson:capture()});notify('Diagnostic snapshot saved',r?.fileName||'Saved locally.')}else if(a==='open-diagnostics')await bridge('openDiagnosticsFolder');else if(a==='export-portable'){const raw=capture();if(!raw)throw new Error('Could not capture current state.');const r=await bridge('exportPortable',{backupJson:raw});if(!r?.cancelled)notify('Portable backup exported',r?.fileName||'Saved.')}else if(a==='import-portable'){const r=await bridge('importPortable');if(r?.cancelled)return;if(!confirm(`Import ${r.fileName||'this backup'}? The current state will be saved first.`))return;const cur=capture();if(cur)await bridge('createRestorePoint',{backupJson:cur,reason:'before_portable_import'});applyBackupJson(r.backupJson)}else if(a==='check-update')await checkUpdate();else if(a==='install-online')await installOnline();else if(a==='install-local'){const u=update||await checkUpdate();if(u?.candidatePath)await installLocal(u.candidatePath)}else if(a==='choose-local')await installLocal('')}catch(err){notify('Michel’s Life',String(err?.message||err),{kind:'error',persistent:true})}},true);
const mo=new MutationObserver(()=>{clearTimeout(mo._t);mo._t=setTimeout(mount,100)});try{mo.observe(document.body,{childList:true,subtree:true})}catch(_){}
document.addEventListener('click',e=>{if(e.target.closest?.('[data-v30171-setting="data"],[data-v30171-setting="about"]'))setTimeout(()=>{mount();if(e.target.closest?.('[data-v30171-setting="about"]')&&!update)checkUpdate()},140)},true);
if(sessionStorage.getItem('mlv202Imported')){sessionStorage.removeItem('mlv202Imported');setTimeout(()=>notify('Backup imported','Portable Michel’s Life state restored.'),800)}
setTimeout(mount,800);window.MLV202ReleaseReadiness={version:VERSION,mount,runDiagnostics:runDiag,checkUpdates:checkUpdate};
})();
</script>
