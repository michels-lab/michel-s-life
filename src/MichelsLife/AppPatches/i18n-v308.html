const originalText=new WeakMap();
const originalAttrs=new WeakMap();
const ATTRS=['title','placeholder','aria-label','data-tooltip'];

function translateValue(value){
  if(language!=='es')return value;
  const trimmed=String(value??'').trim();
  if(!trimmed)return value;
  if(Object.prototype.hasOwnProperty.call(ES,trimmed)){
    const left=String(value).match(/^\s*/)?.[0]||'';
    const right=String(value).match(/\s*$/)?.[0]||'';
    return left+ES[trimmed]+right;
  }
  return value;
}

function shouldSkip(node){
  const p=node.parentElement;
  if(!p)return true;
  return !!p.closest('script,style,textarea,pre,code,[contenteditable="true"],[data-mlv-i18n-skip]');
}

function translateTextNode(node){
  if(shouldSkip(node))return;
  if(!originalText.has(node))originalText.set(node,node.nodeValue||'');
  const base=originalText.get(node)||'';
  node.nodeValue=language==='es'?translateValue(base):base;
}

function translateAttrs(el){
  if(!(el instanceof Element))return;
  let originals=originalAttrs.get(el);
  if(!originals){originals={};originalAttrs.set(el,originals)}
  for(const attr of ATTRS){
    if(!el.hasAttribute(attr))continue;
    if(!(attr in originals))originals[attr]=el.getAttribute(attr)||'';
    const base=originals[attr];
    el.setAttribute(attr,language==='es'?translateValue(base):base);
  }
}

function translateTree(root=document.body){
  if(!root)return;
  if(root.nodeType===Node.TEXT_NODE){translateTextNode(root);return}
  if(root.nodeType!==Node.ELEMENT_NODE&&root.nodeType!==Node.DOCUMENT_NODE&&root.nodeType!==Node.DOCUMENT_FRAGMENT_NODE)return;
  if(root instanceof Element)translateAttrs(root);
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_ELEMENT|NodeFilter.SHOW_TEXT);
  let n;
  while((n=walker.nextNode())){
    if(n.nodeType===Node.TEXT_NODE)translateTextNode(n);
    else translateAttrs(n);
  }
}

function cardMarkup(){
  const es=language==='es';
  return '<section class="card" data-mlv-i18n-card data-mlv-i18n-skip>'+
    '<div class="section-title"><div><h2>'+(es?'Idioma':'Language')+'</h2><p>'+(es?"Elige el idioma que se usa en Michel\'s Life.":"Choose the language used throughout Michel\'s Life.")+'</p></div><span class="pill">EN / ES</span></div>'+
    '<div class="mlv-i18n-options">'+
      '<button type="button" class="mlv-i18n-choice'+(language==='en'?' active':'')+'" data-mlv-lang="en">English</button>'+
      '<button type="button" class="mlv-i18n-choice'+(language==='es'?' active':'')+'" data-mlv-lang="es">Español</button>'+
    '</div>'+
    '<div class="mlv-i18n-note">'+(es?'Puedes cambiarlo cuando quieras.':'You can change this at any time.')+'</div>'+
  '</section>';
}

function mountCard(){
  const generalButton=document.querySelector('[data-v30171-setting="general"]');
  const pane=document.querySelector('[data-v30171-pane="general"]')||
    (generalButton?.classList.contains('active')?document.querySelector('.v30171-settings-pane.active'):null);
  if(!pane)return;
  let card=pane.querySelector('[data-mlv-i18n-card]');
  if(!card){
    const t=document.createElement('template');
    t.innerHTML=cardMarkup();
    card=t.content.firstElementChild;
    const title=pane.querySelector('.v30171-pane-title');
    if(title)title.insertAdjacentElement('afterend',card);else pane.prepend(card);
  }else{
    const t=document.createElement('template');
    t.innerHTML=cardMarkup();
    card.replaceWith(t.content.firstElementChild);
  }
}

function setLanguage(next,persist=true){
  next=String(next||'').toLowerCase();
  if(!SUPPORTED.has(next))return;
  language=next;
  document.documentElement.lang=next;
  document.documentElement.dataset.mlvLanguage=next;
  if(persist){try{localStorage.setItem(STORAGE,next)}catch(_){}}
  translateTree(document.body);
  mountCard();
  try{window.dispatchEvent(new CustomEvent('mlv:languagechange',{detail:{language:next}}))}catch(_){}
}

document.addEventListener('click',e=>{
  if(e.target.closest?.('[data-v30171-setting="general"]')){
    setTimeout(mountCard,80);
  }
  const b=e.target.closest?.('[data-mlv-lang]');
  if(!b)return;
  e.preventDefault();
  setLanguage(b.dataset.mlvLang,true);
},true);

const observer=new MutationObserver(records=>{
  let needsCard=false;
  for(const r of records){
    if(r.type==='attributes'){
      const el=r.target;
      if(el?.matches?.('[data-v30171-setting="general"],.v30171-settings-pane'))needsCard=true;
      continue;
    }
    for(const n of r.addedNodes){
      translateTree(n);
      if(n.nodeType===1&&(n.matches?.('[data-v30171-setting="general"],.v30171-settings-pane')||n.querySelector?.('[data-v30171-setting="general"],.v30171-settings-pane')))needsCard=true;
    }
  }
  clearTimeout(observer._cardTimer);
  observer._cardTimer=setTimeout(()=>{if(needsCard)mountCard()},80);
});
function start(){
  document.documentElement.lang=language;
  document.documentElement.dataset.mlvLanguage=language;
  translateTree(document.body);
  mountCard();
  try{observer.observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class']})}catch(_){}
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();

window.MLVI18nV308={
  version:'3.0.8',
  get language(){return language},
  set:setLanguage,
  translate:translateTree,
  translations:ES
};
})();
