name: Bump v3.0.203 host version

on:
  push:
    branches:
      - refactor/v3.0.203-canonical-frontend

permissions:
  contents: write

jobs:
  bump:
    if: ${{ !contains(github.event.head_commit.message, '[host-v303]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v3.0.203-canonical-frontend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update packed host source
        run: |
          python tools/materialize_host_source.py
          python - <<'PY'
          from pathlib import Path
          import base64,gzip
          root=Path('src/MichelsLife')
          p=root/'Program.cs'
          s=p.read_text(encoding='utf-8')
          old='CurrentAppVersion = new("3.0.202")'
          new='CurrentAppVersion = new("3.0.203")'
          if old not in s and new not in s:
              raise SystemExit('CurrentAppVersion anchor not found')
          s=s.replace(old,new)
          data=s.encode('utf-8')
          packed=base64.b64encode(gzip.compress(data,compresslevel=9,mtime=0)).decode('ascii')
          (root/'Program.cs.gz.b64').write_text(packed+'\n',encoding='ascii')
          PY
          rm -f src/MichelsLife/Program.cs src/MichelsLife/GoogleCalendarService.cs
          rm -f .github/workflows/bump-v303-host.yml
      - name: Commit host version
        run: |
          git config user.name "Michel's Life Build"
          git config user.email "realmichelduarte@gmail.com"
          git add src/MichelsLife/Program.cs.gz.b64 .github/workflows/bump-v303-host.yml
          git commit -m "build: bump embedded host to v3.0.203 [host-v303]"
          git push origin HEAD:refactor/v3.0.203-canonical-frontend
