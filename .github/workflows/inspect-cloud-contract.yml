name: Inspect cloud contract

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-cloud-contract.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize host
        run: python tools/materialize_host_source.py
      - name: Print cloud sync contract
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in [Path('src/MichelsLife/Program.cs'), Path('src/MichelsLife/GoogleCalendarService.cs')]:
              print('\n===== '+str(path)+' =====')
              lines=path.read_text(encoding='utf-8',errors='replace').splitlines()
              needles=('cloudSync','CloudSync','appDataFolder','DriveService','Scopes','scope','CloudFile','cloud save','CloudSave','CloudDirty','cloudDirty','cloudAccept','remoteHash','localHash','backupJson','modifiedTime','ModifiedTime','appData')
              hits=set()
              for i,line in enumerate(lines):
                  if any(n.lower() in line.lower() for n in needles):
                      for j in range(max(0,i-5),min(len(lines),i+14)):
                          hits.add(j)
              last=-2
              for j in sorted(hits):
                  if j>last+1: print('\n---')
                  print(f'{j+1:04d}: {lines[j]}')
                  last=j
          PY
