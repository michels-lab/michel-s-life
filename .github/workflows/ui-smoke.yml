name: UI smoke

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'src/MichelsLife/frontend/**'
      - 'branding/**'
      - 'tools/**'
      - 'android/android-bridge.js'
      - 'android/tools/prepare_bundle.py'
      - '.github/workflows/ui-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASES_REPO: michels-lab/michel-s-life-releases

jobs:
  ui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build browser-test bundle from canonical frontend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts/ui-bundle
          python tools/download_latest_michels_life_bundle.py --repo "$RELEASES_REPO" --output artifacts/AppBundle.zip
          python tools/bump_frontend_version.py --index src/MichelsLife/frontend/index.html
          python tools/enable_i18n.py --index src/MichelsLife/frontend/index.html
          python tools/validate_generated_index.py --index src/MichelsLife/frontend/index.html
          python tools/replace_bundle_index.py --bundle artifacts/AppBundle.zip --index src/MichelsLife/frontend/index.html
          python tools/inject_bundle_asset.py --bundle artifacts/AppBundle.zip --source src/MichelsLife/frontend/i18n.js --arcname i18n.js
          python tools/inject_bundle_asset.py --bundle artifacts/AppBundle.zip --source branding/michel_duarte_avatar.jpg --arcname assets/michel_duarte_avatar.jpg
          python tools/inject_bundle_asset.py --bundle artifacts/AppBundle.zip --source branding/michels_life_app_icon.svg --arcname assets/michels_life_app_icon.svg
          python tools/inject_bundle_asset.py --bundle artifacts/AppBundle.zip --source branding/michels_life_mark.svg --arcname assets/michels_life_mark.svg
          python tools/inject_bundle_asset.py --bundle artifacts/AppBundle.zip --source branding/michels_life_lockup.svg --arcname assets/michels_life_lockup.svg
          python tools/inject_bundle_asset.py --bundle artifacts/AppBundle.zip --source branding/michels_lab_mark.png --arcname assets/michels_lab_mark.png
          python tools/inject_bundle_asset.py --bundle artifacts/AppBundle.zip --source branding/michels_lab_lockup.png --arcname assets/michels_lab_lockup.png
          python - <<'PY'
          from zipfile import ZipFile
          with ZipFile('artifacts/AppBundle.zip') as z:
              z.extractall('artifacts/ui-bundle')
          PY

      - name: Audit Spanish source copy
        run: node tools/spanish_copy_source_audit.mjs

      - name: Install Chromium test runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Render and test critical UI
        run: |
          python -m http.server 4173 --directory artifacts/ui-bundle >/tmp/mlv-http.log 2>&1 &
          export MLV_UI_URL=http://127.0.0.1:4173
          export MLV_UI_SCREENSHOTS=artifacts/ui-smoke
          node tools/ui_smoke_v303.mjs

      - name: Audit automatic desktop update detection
        run: |
          export MLV_UI_URL=http://127.0.0.1:4173
          node tools/ui_auto_update_smoke.mjs

      - name: Audit desktop Quick Capture
        run: |
          export MLV_UI_URL=http://127.0.0.1:4173
          node tools/ui_quick_capture_smoke.mjs

      - name: Audit desktop Sync Center and Command Palette
        run: |
          export MLV_UI_URL=http://127.0.0.1:4173
          node tools/ui_desktop_experience_smoke.mjs

      - name: Audit Supabase primary sync
        run: |
          export MLV_UI_URL=http://127.0.0.1:4173
          node tools/ui_supabase_sync_smoke.mjs

      - name: Audit Supabase sync in Android mode
        run: |
          export MLV_UI_URL=http://127.0.0.1:4173
          node tools/ui_supabase_android_sync_smoke.mjs

      - name: Audit Supabase cross-device Windows Android sync
        run: |
          export MLV_UI_URL=http://127.0.0.1:4173
          node tools/ui_supabase_cross_device_smoke.mjs

      - name: Audit Spanish first run
        run: |
          export MLV_UI_URL=http://127.0.0.1:4173
          node tools/ui_spanish_first_run_smoke.mjs

      - name: Audit installed language and Settings selector
        run: |
          export MLV_UI_URL=http://127.0.0.1:4173
          node tools/ui_installed_language_smoke.mjs

      - name: Probe Spanish Missions controls
        run: |
          export MLV_UI_URL=http://127.0.0.1:4173
          node tools/ui_spanish_missions_probe.mjs

      - name: Audit Spanish interface
        run: |
          export MLV_UI_URL=http://127.0.0.1:4173
          node tools/ui_spanish_smoke.mjs

      - name: Audit exhaustive Spanish UI
        run: |
          export MLV_UI_URL=http://127.0.0.1:4173
          node tools/ui_spanish_exhaustive_smoke.mjs

      - name: Generate and audit complete bilingual system corpus
        run: |
          export MLV_UI_URL=http://127.0.0.1:4173
          node tools/ui_i18n_generated_corpus_smoke.mjs

      - name: Audit Spanish-English round trip and translated control overflow
        run: |
          export MLV_UI_URL=http://127.0.0.1:4173
          node tools/ui_language_roundtrip_smoke.mjs

      - name: Audit installer language and Settings selector
        run: |
          export MLV_UI_URL=http://127.0.0.1:4173
          node tools/ui_installer_language_settings_smoke.mjs

      - name: Audit Settings integrity and translated theme controls
        run: |
          export MLV_UI_URL=http://127.0.0.1:4173
          node tools/ui_settings_integrity_smoke.mjs

      - name: Audit Spanish Dashboard
        run: |
          export MLV_UI_URL=http://127.0.0.1:4173
          node tools/ui_spanish_dashboard_smoke.mjs

      - name: Audit Spanish tab-switch animation continuity
        run: |
          export MLV_UI_URL=http://127.0.0.1:4173
          node tools/ui_spanish_seasonal_animation_smoke.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: ui-smoke-v3.0.216
          path: |
            artifacts/ui-smoke
            /tmp/mlv-http.log
          if-no-files-found: warn
          retention-days: 7
