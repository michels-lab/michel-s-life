name: Owner-authorized Michel's Life Windows v3.0.216 publication

# One-shot, opt-in source-repository trigger. Normal main pushes and PRs cannot publish.
on:
  push:
    branches: [main]
    paths:
      - '.michelslab/release-requests/windows-v3.0.216.json'

permissions:
  contents: read

jobs:
  verify-release-intent:
    name: Verify exact owner-authorized release intent
    if: >-
      github.repository == 'michels-lab/michel-s-life' &&
      github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, '[release windows v3.0.216]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check request, channel and version against canonical source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, xml.etree.ElementTree as ET
          req = json.loads(Path('.michelslab/release-requests/windows-v3.0.216.json').read_text())
          version = ET.parse('src/MichelsLife/MichelsLife.csproj').getroot().findtext('./PropertyGroup/Version')
          assert req['authorized'] is True, 'Release not authorized'
          assert req['version'] == version == '3.0.216', 'Release version mismatch'
          assert req['channel'] == 'direct-windows', 'Unexpected target release channel'
          assert req['public_repository'] == 'michels-lab/michel-s-life-releases', 'Wrong binary publisher'
          assert req['candidate_sha'] == '27fc043bd97e9a0d23383d171cf295ab10d56538', 'Unrecognized validated candidate'
          print('Verified owner authorization: Windows v3.0.216 direct release; Play/Store excluded')
          PY
      - name: Check that this stable version is not already published
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || { echo "::error::Missing RELEASES_REPO_TOKEN"; exit 1; }
          if gh release view v3.0.216 --repo michels-lab/michel-s-life-releases >/dev/null 2>&1; then
            echo "::error::v3.0.216 already exists; refusing to overwrite existing public assets."
            exit 1
          fi

  publish-windows:
    name: Build, install-test and publish Windows release
    needs: verify-release-intent
    uses: ./.github/workflows/release-windows.yml
    with:
      publish: true
    secrets: inherit
