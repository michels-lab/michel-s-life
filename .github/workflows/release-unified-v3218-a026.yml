name: Publish unified Michel's Life Windows 3.0.218 + Android Direct 0.2.6

on:
  push:
    branches: [main]
    paths:
      - '.michelslab/release-intents/unified-v3218-a026.txt'

permissions:
  contents: read
  actions: read

concurrency:
  group: michelslife-unified-v3218-a026
  cancel-in-progress: false

jobs:
  exact-source-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Require isolated explicit release intent and exact-source CI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          expected='.michelslab/release-intents/unified-v3218-a026.txt'
          actual="$(git diff --name-only HEAD^ HEAD)"
          test "$actual" = "$expected" || { echo "::error::Release intent must be the only changed file"; exit 1; }
          for attempt in $(seq 1 45); do
            gh api -X GET "repos/$GITHUB_REPOSITORY/actions/runs" -f head_sha="$GITHUB_SHA" -f per_page=100 > runs.json
            all_green=true
            for name in 'Source validation' 'Android UI smoke' 'UI smoke'; do
              if ! jq -e --arg name "$name" 'any(.workflow_runs[]; .name==$name and .head_sha==env.GITHUB_SHA and .conclusion=="success")' runs.json >/dev/null; then
                all_green=false
              fi
            done
            if [[ "$all_green" == true ]]; then
              echo "Exact-source-sha CI succeeded: $GITHUB_SHA"
              exit 0
            fi
            sleep 20
          done
          echo "::error::Exact-commit Source/Android UI/Desktop UI validation did not all succeed"; exit 1

  build-windows:
    uses: ./.github/workflows/release-windows.yml
    with:
      publish: false
    secrets: inherit

  build-android:
    uses: ./.github/workflows/android-build.yml
    with:
      build_direct: true
    secrets: inherit

  publish:
    needs: [exact-source-gate, build-windows, build-android]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
      DESTINATION: michels-lab/michel-s-life-releases
      TAG: v3.0.218
      ANDROID_CERT_PIN: ${{ vars.ANDROID_DIRECT_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v4
      - name: Download actual SAME-RUN validated Windows package
        uses: actions/download-artifact@v4
        with:
          name: MichelsLife-Windows-v3.0.218
          path: windows
      - name: Download actual SAME-RUN permanently signed Android Direct package
        uses: actions/download-artifact@v4
        with:
          name: MichelsLife-Android-Direct-v0.2.6
          path: android-signed

      - name: Check exact source, package, versions, signature and binaries before publication
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test -n "$ANDROID_CERT_PIN"
          grep -q '<Version>3.0.218</Version>' src/MichelsLife/MichelsLife.csproj
          grep -q 'versionCode = 8' android/app/build.gradle.kts
          grep -q 'versionName = "0.2.6"' android/app/build.gradle.kts
          test "$(jq -r .versionName android-signed/direct-release-manifest.json)" = "0.2.6"
          jq -e --arg sha "$GITHUB_SHA" --arg cert "$ANDROID_CERT_PIN" '
            .sourceSha==$sha and .platform=="android"
            and .distribution=="production-signed"
            and .package=="com.michelslab.michelslife"
            and .versionName=="0.2.6" and .versionCode==8
            and .signerCertSha256==$cert' android-signed/direct-release-manifest.json
          ( cd android-signed && sha256sum -c MichelsLife-Android-Direct-v0.2.6.apk.sha256 )
          test "$(sha256sum android-signed/MichelsLife-Android-Direct-v0.2.6.apk | awk '{print $1}')" = "$(jq -r .sha256 android-signed/direct-release-manifest.json)"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs android-signed/MichelsLife-Android-Direct-v0.2.6.apk > android-signing.txt
          actual_cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' android-signing.txt | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$actual_cert" = "$ANDROID_CERT_PIN"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging android-signed/MichelsLife-Android-Direct-v0.2.6.apk | grep -Eq "name='com.michelslab.michelslife' versionCode='8' versionName='0.2.6'"
          for file in MichelsLife-Setup-v3.0.218.exe MichelsLife-Portable-v3.0.218.exe MichelsLife-v3.0.218.exe; do
            test -s "windows/$file"
            test -s "windows/$file.sha256"
            (cd windows && sha256sum -c "$file.sha256")
          done
          test "$(sha256sum windows/MichelsLife-Portable-v3.0.218.exe | awk '{print $1}')" = "$(sha256sum windows/MichelsLife-v3.0.218.exe | awk '{print $1}')"
          test -s windows/AppBundle.zip
          test -s windows/michels_life_icon.ico
          grep -q 'LAUNCH PASS' windows/MichelsLife-Installed-launch.txt
          grep -q 'LAUNCH PASS' windows/MichelsLife-Portable-launch.txt
          if gh release view "$TAG" --repo "$DESTINATION" >/dev/null 2>&1; then
            echo "::error::Public v3.0.218 tag already exists; do not overwrite reviewed binaries"; exit 1
          fi

      - name: Assemble exact candidate with independent checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp windows/MichelsLife-{Setup,Portable}-v3.0.218.exe* dist/
          cp windows/MichelsLife-v3.0.218.exe* dist/
          cp windows/AppBundle.zip windows/michels_life_icon.ico dist/
          cp android-signed/MichelsLife-Android-Direct-v0.2.6.apk* dist/
          cp android-signed/direct-release-manifest.json dist/android-v0.2.6-manifest.json
          cp android-signing.txt dist/android-signing-certificate-v0.2.6.txt
          python3 - <<'PY'
          import json, os, hashlib
          from pathlib import Path
          p = Path("dist")
          assets = {f.name: hashlib.sha256(f.read_bytes()).hexdigest() for f in p.iterdir() if f.is_file()}
          payload = {"schema": 1, "product":"Michel's Life",
            "source_repo": os.environ["GITHUB_REPOSITORY"],
            "source_sha": os.environ["GITHUB_SHA"],
            "windows_version":"3.0.218","android_version":"0.2.6",
            "android_version_code":8, "android_certificate_sha256":os.environ["ANDROID_CERT_PIN"],
            "assets_sha256":assets}
          (p/"release-provenance.json").write_text(json.dumps(payload,indent=2)+"\n")
          PY

      - name: Create complete DRAFT only; verify and then publish both platforms atomically
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/* --repo "$DESTINATION" --target main --draft \
            --title "Michel's Life — Windows v3.0.218 + Android v0.2.6" \
            --notes-file docs/releases/v3.0.218.md
          gh release view "$TAG" --repo "$DESTINATION" --json isDraft,assets,name > public.json
          jq -e '.isDraft==true and (.assets|length)==13' public.json
          for name in \
            MichelsLife-Setup-v3.0.218.exe MichelsLife-Setup-v3.0.218.exe.sha256 \
            MichelsLife-Portable-v3.0.218.exe MichelsLife-Portable-v3.0.218.exe.sha256 \
            MichelsLife-v3.0.218.exe MichelsLife-v3.0.218.exe.sha256 \
            MichelsLife-Android-Direct-v0.2.6.apk MichelsLife-Android-Direct-v0.2.6.apk.sha256 \
            android-v0.2.6-manifest.json android-signing-certificate-v0.2.6.txt \
            AppBundle.zip michels_life_icon.ico release-provenance.json; do
              jq -e --arg n "$name" 'any(.assets[]; .name==$n)' public.json >/dev/null
          done
          mkdir -p downloaded
          gh release download "$TAG" --repo "$DESTINATION" --dir downloaded \
            --pattern 'MichelsLife-Android-Direct-v0.2.6.apk*' \
            --pattern 'MichelsLife-Setup-v3.0.218.exe*' \
            --pattern 'release-provenance.json'
          (cd downloaded && sha256sum -c MichelsLife-Android-Direct-v0.2.6.apk.sha256 && sha256sum -c MichelsLife-Setup-v3.0.218.exe.sha256)
          cmp -s downloaded/release-provenance.json dist/release-provenance.json
          gh release edit "$TAG" --repo "$DESTINATION" --draft=false --latest
          test "$(gh api "repos/$DESTINATION/releases/latest" --jq '.tag_name')" = "$TAG"
          echo "UNIFIED_RELEASE_VERIFIED: $TAG $GITHUB_SHA"
