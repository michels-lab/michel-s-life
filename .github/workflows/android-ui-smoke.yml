name: Android UI smoke

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'android/android-bridge.js'
      - 'android/tools/prepare_bundle.py'
      - 'tools/ui_android_mobile_smoke.mjs'
      - 'tools/ui_supabase_android_sync_smoke.mjs'
      - 'src/MichelsLife/frontend/**'
      - 'branding/**'
      - 'tools/bump_frontend_version.py'
      - 'tools/enable_i18n.py'
      - 'tools/validate_generated_index.py'
      - 'tools/replace_bundle_index.py'
      - 'tools/inject_bundle_asset.py'
      - '.github/workflows/android-ui-smoke.yml'

permissions:
  contents: read

env:
  RELEASES_REPO: michels-lab/michel-s-life-releases

jobs:
  android-ui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download current Michel's Life AppBundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts
          python tools/download_latest_michels_life_bundle.py --repo "$RELEASES_REPO" --output artifacts/AppBundle-android.zip

      - name: Install Chromium test runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Overlay canonical Michel's Life frontend
        run: |
          python tools/bump_frontend_version.py --index src/MichelsLife/frontend/index.html
          python tools/enable_i18n.py --index src/MichelsLife/frontend/index.html
          python tools/validate_generated_index.py --index src/MichelsLife/frontend/index.html
          python tools/replace_bundle_index.py --bundle artifacts/AppBundle-android.zip --index src/MichelsLife/frontend/index.html
          python tools/inject_bundle_asset.py --bundle artifacts/AppBundle-android.zip --source src/MichelsLife/frontend/i18n.js --arcname i18n.js
          python tools/inject_bundle_asset.py --bundle artifacts/AppBundle-android.zip --source branding/michel_duarte_avatar.jpg --arcname assets/michel_duarte_avatar.jpg
          python tools/inject_bundle_asset.py --bundle artifacts/AppBundle-android.zip --source branding/michels_life_app_icon.svg --arcname assets/michels_life_app_icon.svg
          python tools/inject_bundle_asset.py --bundle artifacts/AppBundle-android.zip --source branding/michels_life_mark.svg --arcname assets/michels_life_mark.svg
          python tools/inject_bundle_asset.py --bundle artifacts/AppBundle-android.zip --source branding/michels_life_lockup.svg --arcname assets/michels_life_lockup.svg
          python tools/inject_bundle_asset.py --bundle artifacts/AppBundle-android.zip --source branding/michels_lab_mark.png --arcname assets/michels_lab_mark.png
          python tools/inject_bundle_asset.py --bundle artifacts/AppBundle-android.zip --source branding/michels_lab_lockup.png --arcname assets/michels_lab_lockup.png

      - name: Prepare Android browser fixture
        run: |
          python android/tools/prepare_bundle.py \
            --bundle artifacts/AppBundle-android.zip \
            --assets artifacts/android-ui-bundle

      - name: Audit Android mobile UX at 412x915
        run: |
          python -m http.server 4174 --directory artifacts/android-ui-bundle >/tmp/mlv-android-http.log 2>&1 &
          export MLV_ANDROID_UI_URL=http://127.0.0.1:4174
          export MLV_ANDROID_UI_SCREENSHOT=artifacts/android-ui-smoke/android-mobile.png
          node tools/ui_android_mobile_smoke.mjs

      - name: Audit Android Supabase sync contract
        run: |
          export MLV_UI_URL=http://127.0.0.1:4174
          node tools/ui_supabase_android_sync_smoke.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: android-ui-smoke-v0.2.1
          path: |
            artifacts/android-ui-smoke
            /tmp/mlv-android-http.log
          if-no-files-found: warn
          retention-days: 7
