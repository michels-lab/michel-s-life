name: Build Windows release

on:
  workflow_dispatch:
    inputs:
      bundle_url:
        description: Optional AppBundle.zip bootstrap URL. Leave empty to use latest public release.
        required: false
        type: string
      publish:
        description: Publish the generated build to the public releases repository.
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  RELEASES_REPO: michels-lab/michel-s-life-releases
  HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERT_BASE64 != '' }}
  HAS_RELEASE_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN != '' }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Materialize host source
        shell: pwsh
        run: python tools/materialize_host_source.py

      - name: Validate source
        shell: pwsh
        run: python tools/release_smoke_test.py

      - name: Resolve release version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -like 'v*') {
            $v = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            [xml]$proj = Get-Content 'src/MichelsLife/MichelsLife.csproj'
            $v = [string]$proj.Project.PropertyGroup.Version
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Building Michel's Life v$v"

      - name: Download current visual bundle
        shell: pwsh
        env:
          INPUT_BUNDLE_URL: ${{ inputs.bundle_url }}
        run: |
          $base = $env:INPUT_BUNDLE_URL
          if ([string]::IsNullOrWhiteSpace($base)) {
            python tools/download_release_asset.py --repo $env:RELEASES_REPO --asset AppBundle.zip --tag-prefix v --output src/MichelsLife/AppBundle.zip
          } else {
            Invoke-WebRequest -Uri $base -OutFile 'src/MichelsLife/AppBundle.zip'
          }

      - name: Generate current Michel's Life icon
        shell: pwsh
        run: |
          choco install imagemagick --yes --no-progress
          New-Item -ItemType Directory -Force 'src/MichelsLife/Assets' | Out-Null
          $magick = Get-Command magick -ErrorAction SilentlyContinue
          if (-not $magick) {
            $exe = Get-ChildItem "$env:ProgramFiles\ImageMagick*" -Filter magick.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $exe) { throw 'ImageMagick magick.exe not found.' }
            $magickPath = $exe.FullName
          } else { $magickPath = $magick.Source }
          & $magickPath -background none 'branding/michels_life_logo.webp' -define icon:auto-resize=256,128,64,48,32,16 'src/MichelsLife/Assets/michels_life_icon.ico'
          if ($LASTEXITCODE -ne 0) { throw 'App icon generation failed.' }

      - name: Package canonical v3.0.215 bilingual frontend
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python tools/enable_i18n.py --index src/MichelsLife/frontend/index.html
          python tools/validate_generated_index.py --index src/MichelsLife/frontend/index.html
          python tools/replace_bundle_index.py --bundle src/MichelsLife/AppBundle.zip --index src/MichelsLife/frontend/index.html
          python tools/inject_bundle_asset.py --bundle src/MichelsLife/AppBundle.zip --source src/MichelsLife/frontend/i18n.js --arcname i18n.js
          python tools/inject_bundle_asset.py --bundle src/MichelsLife/AppBundle.zip --source branding/michel_duarte_avatar.jpg --arcname assets/michel_duarte_avatar.jpg
          python tools/inject_bundle_asset.py --bundle src/MichelsLife/AppBundle.zip --source branding/michels_life_logo.webp --arcname assets/michels_life_logo.webp

      - name: Inject Google OAuth build credential
        shell: pwsh
        env:
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GOOGLE_CLIENT_SECRET)) {
            throw 'GOOGLE_CLIENT_SECRET repository secret is required for an official build.'
          }
          $path = 'src/MichelsLife/BuildSecrets.cs'
          $content = Get-Content $path -Raw
          $oauthSecret = $env:GOOGLE_CLIENT_SECRET.Trim()
          if ($oauthSecret.StartsWith('{')) {
            try {
              $oauthConfig = $oauthSecret | ConvertFrom-Json
              $oauthSecret = [string]$oauthConfig.installed.client_secret
            } catch {
              throw 'GOOGLE_CLIENT_SECRET must be either the raw Desktop client_secret or the downloaded Desktop OAuth JSON.'
            }
          }
          if ([string]::IsNullOrWhiteSpace($oauthSecret)) {
            throw 'The Desktop OAuth client_secret resolved to an empty value.'
          }
          $sha = [System.Security.Cryptography.SHA256]::Create()
          try {
            $hashBytes = $sha.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($oauthSecret))
            $secretHash = -join ($hashBytes | ForEach-Object { $_.ToString('x2') })
          } finally {
            $sha.Dispose()
          }
          if ($secretHash -ne 'b3bd5879455e68562da33945ce1377369a961aead618a0c97df1dfa16e11c4c3') {
            throw 'GOOGLE_CLIENT_SECRET does not match the approved Michel''s Life Desktop OAuth client.'
          }
          $escaped = $oauthSecret.Replace('\','\\').Replace('"','\"')
          $content = $content.Replace('__BUILD_SECRET_GOOGLE__', $escaped)
          Set-Content -Path $path -Value $content -NoNewline -Encoding UTF8

      - name: Publish portable Windows executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/publish | Out-Null
          dotnet restore src/MichelsLife/MichelsLife.csproj
          dotnet publish src/MichelsLife/MichelsLife.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -o artifacts/publish
          $v='${{ steps.ver.outputs.version }}'
          Copy-Item artifacts/publish/MichelsLife.exe "artifacts/MichelsLife-v$v.exe"

      - name: Launch-smoke portable Michel's Life executable
        shell: pwsh
        run: |
          $v='${{ steps.ver.outputs.version }}'
          pwsh -File tools/windows_launch_smoke.ps1 \
            -ExePath "artifacts/MichelsLife-v$v.exe" \
            -MinimumAliveSeconds 8 \
            -WindowTimeoutSeconds 20 \
            -EvidencePath artifacts/MichelsLife-Portable-launch.txt

      - name: Optional Authenticode signing for portable EXE
        if: ${{ env.HAS_WINDOWS_CERT == 'true' }}
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes('artifacts/signing.pfx',[Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse | Where-Object {$_.FullName -match '\\x64\\'} | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found' }
          & $signtool.FullName sign /fd SHA256 /f artifacts/signing.pfx /p $env:WINDOWS_CERT_PASSWORD /tr http://timestamp.digicert.com /td SHA256 "artifacts/MichelsLife-v${{ steps.ver.outputs.version }}.exe"
          Remove-Item artifacts/signing.pfx -Force

      - name: Create portable checksum
        shell: pwsh
        run: |
          $v='${{ steps.ver.outputs.version }}'
          $exe="artifacts/MichelsLife-v$v.exe"
          $hash=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  MichelsLife-v$v.exe" | Set-Content "$exe.sha256" -Encoding ascii

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $v='${{ steps.ver.outputs.version }}'
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$v" "/DPublishDir=$((Resolve-Path 'artifacts/publish').Path)" installer/MichelsLife.iss

      - name: Install and launch-smoke Michel's Life installer
        shell: pwsh
        run: |
          $v='${{ steps.ver.outputs.version }}'
          $installer=(Resolve-Path "artifacts/MichelsLife-Setup-v$v.exe").Path
          $installDir=Join-Path (Resolve-Path 'artifacts').Path 'installed-launch-smoke'
          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }

          $installArgs=@(
            '/VERYSILENT',
            '/SUPPRESSMSGBOXES',
            '/NORESTART',
            '/SP-',
            '/CURRENTUSER',
            "/DIR=`"$installDir`""
          )
          $install=Start-Process -FilePath $installer -ArgumentList $installArgs -PassThru
          if (-not $install.WaitForExit(60000)) {
            try { $install.Kill($true) } catch {}
            throw 'Michel''s Life installer timed out during silent installation.'
          }
          if ($install.ExitCode -ne 0) {
            throw "Michel's Life installer failed with exit code $($install.ExitCode)."
          }

          $installedExe=Join-Path $installDir 'MichelsLife.exe'
          if (-not (Test-Path $installedExe)) {
            throw "MichelsLife.exe was not installed to $installDir."
          }

          pwsh -File tools/windows_launch_smoke.ps1 \
            -ExePath $installedExe \
            -MinimumAliveSeconds 8 \
            -WindowTimeoutSeconds 20 \
            -EvidencePath artifacts/MichelsLife-Installed-launch.txt

          $uninstaller=Join-Path $installDir 'unins000.exe'
          if (-not (Test-Path $uninstaller)) {
            throw "Michel's Life uninstaller was not created."
          }
          $uninstall=Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -PassThru
          if (-not $uninstall.WaitForExit(60000)) {
            try { $uninstall.Kill($true) } catch {}
            throw 'Michel''s Life uninstall cleanup timed out.'
          }
          if ($uninstall.ExitCode -ne 0) {
            throw "Michel's Life uninstall cleanup failed with exit code $($uninstall.ExitCode)."
          }

          Write-Host "BUILD PASS + INSTALL PASS + LAUNCH PASS for Michel's Life Windows Setup."

      - name: Optional Authenticode signing for installer
        if: ${{ env.HAS_WINDOWS_CERT == 'true' }}
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes('artifacts/signing.pfx',[Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse | Where-Object {$_.FullName -match '\\x64\\'} | Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /fd SHA256 /f artifacts/signing.pfx /p $env:WINDOWS_CERT_PASSWORD /tr http://timestamp.digicert.com /td SHA256 "artifacts/MichelsLife-Setup-v${{ steps.ver.outputs.version }}.exe"
          Remove-Item artifacts/signing.pfx -Force

      - name: Keep bootstrap assets for next release
        shell: pwsh
        run: |
          Copy-Item src/MichelsLife/AppBundle.zip artifacts/AppBundle.zip
          Copy-Item src/MichelsLife/Assets/michels_life_icon.ico artifacts/michels_life_icon.ico

      - name: Upload temporary build artifact
        if: ${{ !((startsWith(github.ref, 'refs/tags/') || inputs.publish == true) && env.HAS_RELEASE_TOKEN == 'true') }}
        uses: actions/upload-artifact@v4
        with:
          name: MichelsLife-v${{ steps.ver.outputs.version }}
          path: |
            artifacts/MichelsLife-v${{ steps.ver.outputs.version }}.exe
            artifacts/MichelsLife-v${{ steps.ver.outputs.version }}.exe.sha256
            artifacts/MichelsLife-Setup-v${{ steps.ver.outputs.version }}.exe
            artifacts/MichelsLife-Portable-launch.txt
            artifacts/MichelsLife-Installed-launch.txt
            artifacts/AppBundle.zip
            artifacts/michels_life_icon.ico

      - name: Publish to public release channel
        if: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.publish == true) && env.HAS_RELEASE_TOKEN == 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          $v='${{ steps.ver.outputs.version }}'
          if ($env:GITHUB_REF_NAME -like 'v*') { $tag=$env:GITHUB_REF_NAME } else { $tag="v$v" }
          $assets=@(
            "artifacts/MichelsLife-v$v.exe",
            "artifacts/MichelsLife-v$v.exe.sha256",
            "artifacts/MichelsLife-Setup-v$v.exe",
            "artifacts/AppBundle.zip",
            "artifacts/michels_life_icon.ico"
          )
          gh release view $tag --repo $env:RELEASES_REPO *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --repo $env:RELEASES_REPO --clobber
          } else {
            gh release create $tag @assets --repo $env:RELEASES_REPO --title "Michel's Life $tag" --notes "Release $tag. See the source changelog for full details."
          }
