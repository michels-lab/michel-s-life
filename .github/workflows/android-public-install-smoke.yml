name: Validate actual public Michel's Life Android APK installation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/android-public-install-smoke.yml'
      - 'android/tools/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-public-install-smoke.yml'

permissions:
  contents: read

jobs:
  install-published-apk:
    name: Download actual GitHub release APK, install and launch on Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download Android v0.2.3 directly from SAME customer-facing Windows release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/public
          gh release download v3.0.216 \
            --repo michels-lab/michel-s-life-releases \
            --pattern 'MichelsLife-Android-Direct-v0.2.3.apk*' \
            --pattern 'android-v0.2.3-manifest.json' \
            --dir artifacts/public
          cd artifacts/public
          sha256sum -c MichelsLife-Android-Direct-v0.2.3.apk.sha256
          jq -e '.versionName == "0.2.3" and .versionCode == 5 and .package == "com.michelslab.michelslife" and .distribution == "production-signed" and .signerCertSha256 == "36a9f5144243d14ebade9d38559cfd7d4d9207c1edba01e6f0fbdd5f076a50fa"' android-v0.2.3-manifest.json
          actual="$(sha256sum MichelsLife-Android-Direct-v0.2.3.apk | awk '{print $1}')"
          test "$actual" = "$(jq -r .sha256 android-v0.2.3-manifest.json)"
          unzip -tq MichelsLife-Android-Direct-v0.2.3.apk >/dev/null
          echo "Downloaded unmodified public production-signed 0.2.3 APK: $actual"
          echo "APK bytes: $(stat -c '%s' MichelsLife-Android-Direct-v0.2.3.apk)"

      - name: Enable emulator KVM acceleration on GitHub hosted runner
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          else
            echo "::warning::Runner has no /dev/kvm; emulator will use software acceleration"
          fi

      - name: Test clean installation and launch of EXACT public APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: life-public-apk
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash android/tools/smoke_published_apk_install.sh

      - name: Keep genuine emulator install/launch output, even if test failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MichelsLife-Android-Direct-v0.2.3-public-install-evidence
          path: artifacts/installed/
          retention-days: 30
          if-no-files-found: warn
