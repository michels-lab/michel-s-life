name: Recover canonical About portrait

on:
  push:
    branches:
      - desktop-v3.0.216
    paths:
      - .github/workflows/recover-canonical-avatar.yml
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Recover approved forest-trail portrait
        run: |
          mkdir -p artifacts
          python - <<'PY'
          from PIL import Image, ImageFile
          from pathlib import Path
          ImageFile.LOAD_TRUNCATED_IMAGES = True
          src=Path('branding/michel_duarte_avatar.jpg')
          out=Path('artifacts/michel_duarte_avatar_recovered.jpg')
          with Image.open(src) as im:
              im.load()
              print('SOURCE', im.format, im.size, im.mode)
              if im.size != (480, 640):
                  raise SystemExit(f'Unexpected canonical portrait dimensions: {im.size}')
              rgb=im.convert('RGB')
              rgb.save(out, 'JPEG', quality=92, optimize=True, progressive=True)
          with Image.open(out) as check:
              check.load()
              print('RECOVERED', check.format, check.size, check.mode, out.stat().st_size)
              if check.size != (480, 640):
                  raise SystemExit('Recovered dimensions changed')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: michels-life-canonical-avatar-recovered
          path: artifacts/michel_duarte_avatar_recovered.jpg
          if-no-files-found: error
          retention-days: 1
