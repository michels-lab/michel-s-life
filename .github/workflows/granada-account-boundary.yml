name: GRANADA - account boundary contract

on:
  pull_request:
    paths:
      - 'src/MichelsLife/frontend/account-boundary.mjs'
      - 'tools/test_granada_account_boundary.mjs'
      - 'tools/ui_granada_account_boundary_crash_browser.mjs'
      - '.github/workflows/granada-account-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  account-boundary-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse browser-compatible account boundary module
        run: node --check src/MichelsLife/frontend/account-boundary.mjs
      - name: Parse deterministic two-account privacy regressions
        run: node --check tools/test_granada_account_boundary.mjs
      - name: Synthetic account switching, guest import and recovery QA
        run: node tools/test_granada_account_boundary.mjs
      - name: Install Chromium for real persistent-storage crash and restart QA
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run actual Chromium page-kill, account switching and forged-journal matrix
        env:
          MLV_ACCOUNT_BOUNDARY_BROWSER_URL: http://127.0.0.1:4188/
        run: |
          python -m http.server 4188 --directory . >/tmp/mlv-account-boundary-http.log 2>&1 &
          node --check tools/ui_granada_account_boundary_crash_browser.mjs
          node tools/ui_granada_account_boundary_crash_browser.mjs
