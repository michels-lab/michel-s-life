name: Stage Michel's Life latest Android v0.2.2 for unified Windows + Android release

on:
  push:
    branches: [main]
    paths:
      - '.michelslab/release-requests/android-v0.2.2-unified-v3.0.216.json'

permissions:
  contents: write

concurrency:
  group: michels-life-android-0-2-2-unified-windows-3-0-216
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.repository == 'michels-lab/michel-s-life' &&
      github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, '[stage unified android v0.2.2]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify this request targets the current Android source
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          req = json.loads(Path('.michelslab/release-requests/android-v0.2.2-unified-v3.0.216.json').read_text())
          gradle = Path('android/app/build.gradle.kts').read_text()
          assert req['authorized'] is True
          assert req['android_version'] == '0.2.2'
          assert req['android_version_code'] == 4
          assert req['windows_version'] == '3.0.216'
          assert req['source_tag'] == 'michels-life-android-transfer-v0.2.2'
          assert re.search(r'versionName\s*=\s*"0\.2\.2"', gradle)
          assert re.search(r'versionCode\s*=\s*4\b', gradle)
          assert re.search(r'applicationId\s*=\s*"com\.michelslab\.michelslife"', gradle)
          print('Request matches Android v0.2.2 code 4; no prior version allowed')
          PY

  build-current-android:
    needs: verify
    uses: ./.github/workflows/android-build.yml
    secrets: inherit

  stage-current-apk:
    needs: build-current-android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MichelsLife-Android-TEST-v0.2.2
          path: staging
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android inspection tools
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0"
      - name: Validate Android version, signing, and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          APK="staging/MichelsLife-Android-TEST-v0.2.2.apk"
          test -s "$APK"
          mkdir -p dist
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$AAPT" dump badging "$APK" | grep -E "^package: name='com\.michelslab\.michelslife' versionCode='4' versionName='0\.2\.2'"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > dist/android-signing-certificate.txt
          test -s dist/android-signing-certificate.txt
          cp "$APK" dist/MichelsLife-Android-v0.2.2-TEST.apk
          (
            cd dist
            sha256sum MichelsLife-Android-v0.2.2-TEST.apk > MichelsLife-Android-v0.2.2-TEST.apk.sha256
            sha256sum -c MichelsLife-Android-v0.2.2-TEST.apk.sha256
          )
          python3 - <<'PY'
          import json, hashlib, os
          from pathlib import Path
          apk=Path('dist/MichelsLife-Android-v0.2.2-TEST.apk')
          meta={
            'product':"Michel's Life",'platform':'android','distribution':'direct-test-apk',
            'versionName':'0.2.2','versionCode':4,'applicationId':'com.michelslab.michelslife',
            'sha256':hashlib.sha256(apk.read_bytes()).hexdigest(),
            'source_sha':os.environ['GITHUB_SHA'],
            'windows_public_release':'v3.0.216',
            'signing':'CI-generated Android debug certificate; not Play signed or a stable update key',
            'notes':'Backup locally; an APK with a different signer cannot overwrite the installed app.'
          }
          Path('dist/android-v0.2.2-manifest.json').write_text(json.dumps(meta,indent=2)+'\n')
          print(f"Verifiable latest Android package: v0.2.2 code 4 sha256 {meta['sha256']}")
          PY
      - name: Stage verified Android APK as source prerelease (not a separate public product release)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=michels-life-android-transfer-v0.2.2
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Android source transfer already exists; refuse to overwrite"
            exit 1
          fi
          gh release create "$TAG" \
            dist/MichelsLife-Android-v0.2.2-TEST.apk \
            dist/MichelsLife-Android-v0.2.2-TEST.apk.sha256 \
            dist/android-v0.2.2-manifest.json \
            dist/android-signing-certificate.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "Michel's Life Android v0.2.2 staging only" \
            --notes "Temporary cross-repo transfer for unified public Windows v3.0.216 + Android v0.2.2 release. Debug signed; not Google Play." \
            --prerelease
