name: Build Android test APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

env:
  RELEASES_REPO: realmichelduarte/michel-s-life-releases

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Validate Windows-compatible cloud contract
        run: python android/tools/validate_sync_contract.py

      - name: Download current Michel's Life AppBundle
        run: |
          mkdir -p android/build
          curl -L --fail --retry 3             "https://github.com/$RELEASES_REPO/releases/latest/download/AppBundle.zip"             -o android/build/AppBundle.zip

      - name: Prepare Android web assets
        run: |
          python android/tools/prepare_bundle.py             --bundle android/build/AppBundle.zip             --assets android/app/src/main/assets/app

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug

      - name: Build Play Store app bundle
        working-directory: android
        run: gradle --no-daemon :app:bundleRelease

      - name: Name APK
        run: |
          mkdir -p artifacts/android
          cp android/app/build/outputs/apk/debug/app-debug.apk             artifacts/android/MichelsLife-Android-TEST-v0.1.0.apk

      - name: Name Play Store app bundle
        run: |
          cp android/app/build/outputs/bundle/release/app-release.aab \
            artifacts/android/MichelsLife-Android-Play-UNSIGNED-v0.1.0.aab
          sha256sum artifacts/android/MichelsLife-Android-Play-UNSIGNED-v0.1.0.aab \
            > artifacts/android/MichelsLife-Android-Play-UNSIGNED-v0.1.0.aab.sha256

      - name: Print Android test signing fingerprints
        shell: bash
        run: |
          APK="artifacts/android/MichelsLife-Android-TEST-v0.1.0.apk"
          echo "=== Android APK signing certificate ==="
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" \
            | tee artifacts/android/signing-certificate.txt
          echo "=== APK SHA-256 ==="
          sha256sum "$APK" | tee artifacts/android/MichelsLife-Android-TEST-v0.1.0.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: MichelsLife-Android-TEST-v0.1.0
          path: artifacts/android/
          if-no-files-found: error
          retention-days: 7
