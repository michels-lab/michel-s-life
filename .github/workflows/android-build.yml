name: Build Android test APK

on:
  workflow_call:
    inputs:
      build_direct:
        description: Also build the stable-signature Android Direct APK (fails closed when key is not configured).
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      build_direct:
        description: Build a permanently signed Android Direct APK (requires secure signing secrets).
        type: boolean
        required: false
        default: false
  pull_request:
    paths:
      - 'android/app/**'
      - 'android/android-bridge.js'
      - 'android/mobile-experience.js'
      - 'android/mobile-sections.js'
      - 'android/tools/**'
      - 'src/MichelsLife/DeveloperDiagnostics.js'
      - 'android/build.gradle.kts'
      - 'android/settings.gradle.kts'
      - 'android/gradle.properties'
      - 'src/MichelsLife/frontend/**'
      - 'branding/**'
      - 'tools/bump_frontend_version.py'
      - 'tools/enable_i18n.py'
      - 'tools/validate_generated_index.py'
      - 'tools/replace_bundle_index.py'
      - 'tools/inject_bundle_asset.py'
      - '.github/workflows/android-build.yml'
  push:
    branches: [main]
    paths:
      - 'android/app/**'
      - 'android/android-bridge.js'
      - 'android/mobile-experience.js'
      - 'android/mobile-sections.js'
      - 'android/tools/**'
      - 'src/MichelsLife/DeveloperDiagnostics.js'
      - 'android/build.gradle.kts'
      - 'android/settings.gradle.kts'
      - 'android/gradle.properties'
      - 'src/MichelsLife/frontend/**'
      - 'branding/**'
      - 'tools/bump_frontend_version.py'
      - 'tools/enable_i18n.py'
      - 'tools/validate_generated_index.py'
      - 'tools/replace_bundle_index.py'
      - 'tools/inject_bundle_asset.py'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

env:
  RELEASES_REPO: michels-lab/michel-s-life-releases
  ANDROID_VERSION: 0.2.9
  ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
  ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
  ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
  ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
  ANDROID_DIRECT_KEYSTORE_BASE64: ${{ secrets.ANDROID_DIRECT_KEYSTORE_BASE64 }}
  ANDROID_DIRECT_STORE_PASSWORD: ${{ secrets.ANDROID_DIRECT_STORE_PASSWORD }}
  ANDROID_DIRECT_KEY_ALIAS: ${{ secrets.ANDROID_DIRECT_KEY_ALIAS }}
  ANDROID_DIRECT_KEY_PASSWORD: ${{ secrets.ANDROID_DIRECT_KEY_PASSWORD }}
  ANDROID_DIRECT_CERT_SHA256: ${{ vars.ANDROID_DIRECT_CERT_SHA256 }}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Validate Windows-compatible cloud contract and safe backup restores
        run: |
          python android/tools/validate_sync_contract.py
          node tools/test_cloud_restore_storage.mjs

      - name: Validate Android version metadata
        run: python android/tools/validate_android_version.py

      - name: Validate Android mobile UX layer
        run: |
          node --check android/android-bridge.js
          node --check android/mobile-experience.js
          node --check android/mobile-sections.js
          python android/tools/validate_android_mobile_ux.py
          python android/tools/validate_developer_twin.py
          python android/tools/validate_provider_integrity.py
          node --check src/MichelsLife/DeveloperDiagnostics.js
          bash -n android/tools/smoke_candidate_apk_install.sh
          python android/tools/native_webview_state_probe.py self-test
          # Validate the release-version generated frontend, not the older raw template.
          python tools/bump_frontend_version.py --index src/MichelsLife/frontend/index.html
          python tools/validate_brand_identity.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test the fail-closed signed APK KPI parity comparator
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check Pillow==11.3.0
          python3 android/tools/compare_signed_native_kpis.py --self-test

      - name: Download current Michel's Life AppBundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p android/build
          python tools/download_latest_michels_life_bundle.py --repo "$RELEASES_REPO" --output android/build/AppBundle.zip

      - name: Package canonical Michel's Life frontend
        run: |
          python tools/bump_frontend_version.py --index src/MichelsLife/frontend/index.html
          python tools/enable_i18n.py --index src/MichelsLife/frontend/index.html
          python tools/validate_generated_index.py --index src/MichelsLife/frontend/index.html
          python tools/replace_bundle_index.py --bundle android/build/AppBundle.zip --index src/MichelsLife/frontend/index.html
          python tools/inject_bundle_asset.py --bundle android/build/AppBundle.zip --source src/MichelsLife/frontend/i18n.js --arcname i18n.js
          python tools/inject_bundle_asset.py --bundle android/build/AppBundle.zip --source branding/michel_duarte_avatar.jpg --arcname assets/michel_duarte_avatar.jpg
          python tools/inject_bundle_asset.py --bundle android/build/AppBundle.zip --source branding/michels_life_app_icon.svg --arcname assets/michels_life_app_icon.svg
          python tools/inject_bundle_asset.py --bundle android/build/AppBundle.zip --source branding/michels_life_mark.svg --arcname assets/michels_life_mark.svg
          python tools/inject_bundle_asset.py --bundle android/build/AppBundle.zip --source branding/michels_life_lockup.svg --arcname assets/michels_life_lockup.svg
          python tools/inject_bundle_asset.py --bundle android/build/AppBundle.zip --source branding/michels_lab_mark.png --arcname assets/michels_lab_mark.png
          python tools/inject_bundle_asset.py --bundle android/build/AppBundle.zip --source branding/michels_lab_lockup.png --arcname assets/michels_lab_lockup.png

      - name: Prepare Android web assets
        run: |
          python android/tools/prepare_bundle.py --bundle android/build/AppBundle.zip --assets android/app/src/main/assets/app

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Verify official Android Direct updates with unsafe/missing asset fixtures
        working-directory: android
        run: gradle --no-daemon :app:testDebugUnitTest :app:testDeveloperDebugUnitTest

      - name: Build debug APK and fully separate Android Developer Twin APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug :app:assembleDeveloperDebug

      - name: Inspect two isolated app IDs and keep Developer-only audit assets out of public APK
        shell: bash
        run: |
          set -euo pipefail
          DEV=android/app/build/outputs/apk/developerDebug/app-developerDebug.apk
          PUB=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$DEV" && test -s "$PUB"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$DEV" > /tmp/mlv-developer-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$PUB" > /tmp/mlv-public-badging.txt
          grep -q "package: name='com.michelslab.michelslife.developer'" /tmp/mlv-developer-badging.txt
          grep -q "package: name='com.michelslab.michelslife'" /tmp/mlv-public-badging.txt
          unzip -Z1 "$DEV" | grep -qx 'assets/app/developer-diagnostics.js'
          if unzip -Z1 "$PUB" | grep -q 'developer-diagnostics.js'; then
            echo "::error::Production/debug customer APK must not embed Developer audit JS"; exit 1
          fi
          mkdir -p artifacts/android-developer
          cp "$DEV" artifacts/android-developer/MichelsLife-Android-Developer-CANDIDATE.apk
          cp /tmp/mlv-developer-badging.txt artifacts/android-developer/package-identity.txt
          sha256sum artifacts/android-developer/MichelsLife-Android-Developer-CANDIDATE.apk > artifacts/android-developer/developer-candidate.sha256
          echo "PASS: distinct Developer package; public package free of instrumentation"

      - name: Retain Android Developer candidate separately (internal QA, NOT public release)
        uses: actions/upload-artifact@v4
        with:
          name: MichelsLife-Android-Developer-CANDIDATE
          path: artifacts/android-developer/
          if-no-files-found: error
          retention-days: 7

      - name: Prepare optional Play upload keystore
        shell: bash
        run: |
          if [[ -n "${ANDROID_UPLOAD_KEYSTORE_BASE64:-}" ]]; then
            for required in ANDROID_UPLOAD_STORE_PASSWORD ANDROID_UPLOAD_KEY_ALIAS ANDROID_UPLOAD_KEY_PASSWORD; do
              if [[ -z "${!required:-}" ]]; then
                echo "::error::$required must be configured when ANDROID_UPLOAD_KEYSTORE_BASE64 is present."
                exit 1
              fi
            done
            KEYSTORE_PATH="$RUNNER_TEMP/michels-life-upload.jks"
            printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            test -s "$KEYSTORE_PATH"
            echo "ANDROID_UPLOAD_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "PLAY_BUNDLE_SIGNING=SIGNED" >> "$GITHUB_ENV"
          else
            echo "PLAY_BUNDLE_SIGNING=UNSIGNED" >> "$GITHUB_ENV"
          fi

      - name: Build Play Store app bundle
        working-directory: android
        run: gradle --no-daemon :app:bundleRelease

      - name: Validate permanent direct APK signing policy
        run: python android/tools/verify_direct_apk.py --self-test

      - name: Prepare persistent direct distribution signing key
        if: ${{ inputs.build_direct == true }}
        shell: bash
        run: |
          set -euo pipefail
          for required in ANDROID_DIRECT_KEYSTORE_BASE64 ANDROID_DIRECT_STORE_PASSWORD ANDROID_DIRECT_KEY_ALIAS ANDROID_DIRECT_KEY_PASSWORD ANDROID_DIRECT_CERT_SHA256; do
            if [[ -z "${!required:-}" ]]; then
              echo "::error::Missing $required: cannot build a stable Android Direct APK. Do not publish a debug APK instead."
              exit 1
            fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/michels-life-direct-release.jks"
          umask 077
          printf '%s' "$ANDROID_DIRECT_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "ANDROID_DIRECT_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build permanently signed Android Direct APK
        if: ${{ inputs.build_direct == true }}
        working-directory: android
        run: gradle --no-daemon :app:assembleDirectRelease

      - name: Verify pinned direct certificate, APK package, version and digest
        if: ${{ inputs.build_direct == true }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/android-direct
          APK="artifacts/android-direct/MichelsLife-Android-Direct-v${ANDROID_VERSION}.apk"
          cp android/app/build/outputs/apk/directRelease/app-directRelease.apk "$APK"
          ANDROID_CODE="$(awk '/versionCode = / { print $3; exit }' android/app/build.gradle.kts)"
          python android/tools/verify_direct_apk.py \
            --apk "$APK" \
            --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt" \
            --expected-cert-sha256 "$ANDROID_DIRECT_CERT_SHA256" \
            --version-name "$ANDROID_VERSION" --version-code "$ANDROID_CODE" \
            --manifest-output artifacts/android-direct/direct-release-manifest.json
          (cd artifacts/android-direct && sha256sum "MichelsLife-Android-Direct-v${ANDROID_VERSION}.apk" > "MichelsLife-Android-Direct-v${ANDROID_VERSION}.apk.sha256")
          echo "PASS: direct build signed with permanent pinned key, not Android Debug"

      - name: Upload VERIFIED production-signed Android Direct APK
        if: ${{ inputs.build_direct == true }}
        uses: actions/upload-artifact@v4
        with:
          name: MichelsLife-Android-Direct-v${{ env.ANDROID_VERSION }}
          path: artifacts/android-direct/
          if-no-files-found: error
          retention-days: 30

      - name: Name APK
        run: |
          mkdir -p artifacts/android
          cp android/app/build/outputs/apk/debug/app-debug.apk             artifacts/android/MichelsLife-Android-TEST-v${ANDROID_VERSION}.apk

      - name: Name Play Store app bundle
        shell: bash
        run: |
          AAB="artifacts/android/MichelsLife-Android-Play-${PLAY_BUNDLE_SIGNING}-v${ANDROID_VERSION}.aab"
          cp android/app/build/outputs/bundle/release/app-release.aab "$AAB"
          sha256sum "$AAB" > "$AAB.sha256"
          echo "PLAY_AAB=$AAB" >> "$GITHUB_ENV"

      - name: Validate Play Store app bundle
        shell: bash
        run: |
          unzip -t "$PLAY_AAB" >/dev/null
          if [[ "$PLAY_BUNDLE_SIGNING" == "SIGNED" ]]; then
            # Google Play upload keys are intentionally self-signed. A valid
            # uploaded AAB fails jarsigner -strict for PKIX trust (not integrity).
            # Verify the real JAR signature with jarsigner's normal mode and
            # additionally pin the upload certificate's SHA-256 identity.
            jarsigner -verify "$PLAY_AAB"
            keytool -printcert -jarfile "$PLAY_AAB" \
              | tee artifacts/android/play-upload-certificate.txt
            actual_upload_cert="$(sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' artifacts/android/play-upload-certificate.txt | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
            expected_upload_cert="ba8cac8157b4e00b698efad7f2909005e72230797ac4032f7dbdcb17bc73c626"
            if [[ "$actual_upload_cert" != "$expected_upload_cert" ]]; then
              echo "::error::Wrong Google Play upload certificate; signed AAB rejected"
              exit 1
            fi
            echo "Validated signed Google Play upload bundle with pinned upload certificate."
          else
            if jarsigner -verify "$PLAY_AAB" 2>&1 | grep -qi "jar is unsigned"; then
              echo "Validated expected unsigned Play preparation bundle."
            else
              echo "::warning::Could not positively identify the preparation bundle as unsigned."
            fi
          fi

      - name: Print Android test signing fingerprints
        shell: bash
        run: |
          APK="artifacts/android/MichelsLife-Android-TEST-v${ANDROID_VERSION}.apk"
          echo "=== Android APK signing certificate ==="
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" \
            | tee artifacts/android/signing-certificate.txt
          echo "=== APK SHA-256 ==="
          sha256sum "$APK" | tee artifacts/android/MichelsLife-Android-TEST-v${ANDROID_VERSION}.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: MichelsLife-Android-TEST-v${{ env.ANDROID_VERSION }}
          path: artifacts/android/
          if-no-files-found: error
          retention-days: 7

  installed-candidate-smoke:
    name: Fresh install + launch of same-run candidate Android APK on Android 16
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_VERSION: 0.2.9
      MLV_REQUIRE_NATIVE_STATE_PROBE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Download candidate APK from SAME workflow run
        uses: actions/download-artifact@v4
        with:
          name: MichelsLife-Android-TEST-v${{ env.ANDROID_VERSION }}
          path: artifacts/candidate



      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned CI-only DevTools probe dependency
        run: python3 -m pip install --disable-pip-version-check websocket-client==1.8.0

      - name: Enable GitHub hosted emulator KVM
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Install and launch real candidate in isolated Android 16 device
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: michels-life-candidate-android16
          # API 36 + gfxstream Vulkan/legacy swiftshader_indirect crashed after the
          # installed WebView rendered on two clean hosted Linux runners. Use
          # current supported SwiftShader GLES and disable Vulkan explicitly;
          # never weaken native screenshot assertions to mask black frames.
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -camera-back none -gpu swiftshader -feature -Vulkan
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash android/tools/smoke_candidate_apk_install.sh

      - name: Retain exact installed APK evidence and Android screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MichelsLife-Android-InstallSmoke-v${{ env.ANDROID_VERSION }}
          path: artifacts/candidate-install/
          if-no-files-found: warn
          retention-days: 30

  installed-developer-smoke:
    name: Install independent Developer Twin APK and native export on Android 16
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_VERSION: 0.2.9
    steps:
      - uses: actions/checkout@v4

      - name: Download developer and customer APK artifacts from exact candidate
        uses: actions/download-artifact@v4
        with:
          pattern: MichelsLife-Android-*
          path: artifacts/qa-download
          merge-multiple: false

      - name: Place exact candidate artifacts in Android native probe paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/candidate artifacts/developer-candidate
          cp "artifacts/qa-download/MichelsLife-Android-TEST-v${ANDROID_VERSION}/MichelsLife-Android-TEST-v${ANDROID_VERSION}.apk" artifacts/candidate/
          cp "artifacts/qa-download/MichelsLife-Android-Developer-CANDIDATE/MichelsLife-Android-Developer-CANDIDATE.apk" artifacts/developer-candidate/

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned CI-only WebView bridge probe
        run: python3 -m pip install --disable-pip-version-check websocket-client==1.8.0

      - name: Enable Android emulator hardware acceleration
        shell: bash
        run: |
          if [[ -e /dev/kvm ]]; then sudo chmod 666 /dev/kvm; fi

      - name: Install separate user and Developer APKs, verify DEV UI and native Save As
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: michels-life-developer-android16
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -camera-back none -gpu swiftshader -feature -Vulkan
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash android/tools/smoke_developer_apk_install.sh

      - name: Preserve actual installed Developer Twin evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MichelsLife-Android-Developer-InstallSmoke-v${{ env.ANDROID_VERSION }}
          path: artifacts/developer-installed/
          if-no-files-found: warn
          retention-days: 30
