name: Source validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize host source
        run: python tools/materialize_host_source.py

      - name: Release-readiness smoke tests
        run: python tools/release_smoke_test.py

      - name: Shared release asset resolver tests
        run: python tools/test_download_release_asset.py

      - name: Canonical frontend validation
        run: |
          python tools/validate_generated_index.py --index src/MichelsLife/frontend/index.html
          node --check src/MichelsLife/frontend/i18n.js

      - name: Validate Android Supabase sync contract
        run: python android/tools/validate_sync_contract.py

      - name: Spanish source copy audit
        run: node tools/spanish_copy_source_audit.mjs

      - name: Generated bilingual system corpus audit
        run: node tools/ui_i18n_generated_corpus_smoke.mjs

      - name: Microsoft Store packaging smoke tests
        run: python tools/store_smoke_test.py


  windows-icon-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Materialize host source
        shell: pwsh
        run: python tools/materialize_host_source.py

      - name: Download current AppBundle for Windows compile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          python tools/download_latest_michels_life_bundle.py --repo "michels-lab/michel-s-life-releases" --output src/MichelsLife/AppBundle.zip
          if (-not (Test-Path 'src/MichelsLife/AppBundle.zip')) { throw 'AppBundle.zip download failed.' }

      - name: Generate Windows icon from canonical product icon
        shell: pwsh
        run: |
          choco install imagemagick --yes --no-progress
          New-Item -ItemType Directory -Force 'src/MichelsLife/Assets' | Out-Null
          $magick = Get-Command magick -ErrorAction SilentlyContinue
          if (-not $magick) {
            $exe = Get-ChildItem "$env:ProgramFiles\ImageMagick*" -Filter magick.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $exe) { throw 'ImageMagick magick.exe not found.' }
            $magickPath = $exe.FullName
          } else {
            $magickPath = $magick.Source
          }
          & $magickPath 'branding/michels_life_app_icon.svg' -define icon:auto-resize=256,128,64,48,32,16 'src/MichelsLife/Assets/michels_life_icon.ico'
          if ($LASTEXITCODE -ne 0) { throw 'Windows icon generation failed.' }

      - name: Compile Windows host with embedded icon
        shell: pwsh
        run: |
          dotnet build src/MichelsLife/MichelsLife.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Windows host compilation failed.' }
          $exe = Get-ChildItem 'src/MichelsLife/bin/Release' -Filter MichelsLife.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'Compiled MichelsLife.exe not found.' }
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($exe.FullName)
          if (-not $icon -or $icon.Width -lt 16 -or $icon.Height -lt 16) {
            throw 'MichelsLife.exe does not expose a valid Windows application icon.'
          }
          Write-Host "Windows icon OK: $($icon.Width)x$($icon.Height)"


      - name: Publish Windows runtime smoke candidate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/publish | Out-Null
          dotnet publish src/MichelsLife/MichelsLife.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -o artifacts/publish
          if (-not (Test-Path 'artifacts/publish/MichelsLife.exe')) {
            throw 'Published MichelsLife.exe not found.'
          }

      - name: Portable Windows runtime launch smoke
        shell: pwsh
        run: |
          pwsh -File tools/windows_launch_smoke.ps1 `
            -ExePath artifacts/publish/MichelsLife.exe `
            -MinimumAliveSeconds 8 `
            -WindowTimeoutSeconds 20 `
            -EvidencePath artifacts/windows-portable-launch.txt

      - name: Build Windows installer smoke candidate
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          [xml]$proj = Get-Content 'src/MichelsLife/MichelsLife.csproj'
          $v = [string]$proj.Project.PropertyGroup.Version
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$v" "/DPublishDir=$((Resolve-Path 'artifacts/publish').Path)" installer/MichelsLife.iss
          if ($LASTEXITCODE -ne 0) { throw 'Michel''s Life installer build failed.' }
          if (-not (Test-Path "artifacts/MichelsLife-Setup-v$v.exe")) {
            throw 'Michel''s Life installer artifact was not created.'
          }

      - name: Installed Windows runtime launch smoke
        shell: pwsh
        run: |
          [xml]$proj = Get-Content 'src/MichelsLife/MichelsLife.csproj'
          $v = [string]$proj.Project.PropertyGroup.Version
          $installer=(Resolve-Path "artifacts/MichelsLife-Setup-v$v.exe").Path
          $installDir=Join-Path (Resolve-Path 'artifacts').Path 'installed-runtime-smoke'
          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }

          $install=Start-Process -FilePath $installer -ArgumentList @(
            '/VERYSILENT',
            '/SUPPRESSMSGBOXES',
            '/NORESTART',
            '/SP-',
            '/CURRENTUSER',
            "/DIR=`"$installDir`""
          ) -PassThru
          if (-not $install.WaitForExit(60000)) {
            try { $install.Kill($true) } catch {}
            throw 'Michel''s Life installer timed out.'
          }
          if ($install.ExitCode -ne 0) {
            throw "Michel's Life installer failed with exit code $($install.ExitCode)."
          }

          $installedExe=Join-Path $installDir 'MichelsLife.exe'
          if (-not (Test-Path $installedExe)) {
            throw "MichelsLife.exe was not installed to $installDir."
          }

          pwsh -File tools/windows_launch_smoke.ps1 `
            -ExePath $installedExe `
            -MinimumAliveSeconds 8 `
            -WindowTimeoutSeconds 20 `
            -EvidencePath artifacts/windows-installed-launch.txt

          $uninstaller=Join-Path $installDir 'unins000.exe'
          if (-not (Test-Path $uninstaller)) {
            throw 'Michel''s Life uninstaller missing after installation.'
          }
          $uninstall=Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -PassThru
          if (-not $uninstall.WaitForExit(60000)) {
            try { $uninstall.Kill($true) } catch {}
            throw 'Michel''s Life uninstall cleanup timed out.'
          }
          if ($uninstall.ExitCode -ne 0) {
            throw "Michel's Life uninstall cleanup failed with exit code $($uninstall.ExitCode)."
          }
          Write-Host "BUILD PASS + INSTALL PASS + LAUNCH PASS for Michel's Life Windows."

      - name: Upload Windows runtime smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-runtime-smoke
          path: |
            artifacts/windows-portable-launch.txt
            artifacts/windows-installed-launch.txt
          if-no-files-found: warn
          retention-days: 7
