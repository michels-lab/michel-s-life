name: GRANADA classical Focus excerpts

on:
  pull_request:
    paths:
      - 'src/MichelsLife/frontend/focus-immersive.js'
      - 'src/MichelsLife/frontend/index.html'
      - 'tools/test_granada_classical_focus.mjs'
      - 'tools/test_granada_focus_audio_quickmission.mjs'
      - '.github/workflows/granada-classical-focus.yml'
  push:
    branches: [main]
    paths:
      - 'src/MichelsLife/frontend/focus-immersive.js'
      - 'src/MichelsLife/frontend/index.html'
      - 'tools/test_granada_classical_focus.mjs'
      - 'tools/test_granada_focus_audio_quickmission.mjs'
      - '.github/workflows/granada-classical-focus.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-domain-focus:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject invalid source or test syntax
        run: |
          node --check src/MichelsLife/frontend/focus-immersive.js
          node --check tools/test_granada_classical_focus.mjs
          node --check tools/test_granada_focus_audio_quickmission.mjs
      - name: Run existing Quick Mission/Pomodoro audio controls
        run: node --test tools/test_granada_focus_audio_quickmission.mjs
      - name: Run classical melody and canonical FocusStory persistence contracts
        run: node --test tools/test_granada_classical_focus.mjs
