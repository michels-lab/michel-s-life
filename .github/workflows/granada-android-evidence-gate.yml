name: GRANADA Android evidence gate (offline synthetic)
on:
  push:
    paths:
      - 'tools/granada_android_evidence_gate.py'
      - 'tools/test_granada_android_evidence_gate.py'
      - '.github/workflows/granada-android-evidence-gate.yml'
  pull_request:
    paths:
      - 'tools/granada_android_evidence_gate.py'
      - 'tools/test_granada_android_evidence_gate.py'
      - '.github/workflows/granada-android-evidence-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-offline-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run nine fail-closed synthetic regressions (not an installed APK test)
        run: python -m unittest discover -s tools -p 'test_granada_android_evidence_gate.py' -v
