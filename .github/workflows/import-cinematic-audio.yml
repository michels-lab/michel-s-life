name: Import licensed cinematic audio collection
on:
  push:
    branches:
      - granada/focus-clock-first-classical-completion-20261124
    paths:
      - 'tools/import_cinematic_audio.py'
      - '.github/workflows/import-cinematic-audio.yml'
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'michels-lab/michel-s-life'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python3 tools/import_cinematic_audio.py
      - run: node --test tools/test_granada_classical_focus.mjs
      - name: Commit verified recordings only
        run: |
          git config user.name "Michel's Life Recording Import"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MichelsLife/frontend/assets/audio/classical/sb_*.mp3 src/MichelsLife/frontend/assets/audio/classical/LIBRARY.json android/app/src/main/res/raw/mlv_focus_sb_*.mp3
          git diff --cached --stat
          git commit -m "assets(audio): import twelve licensed Scott Buckley recordings"
          git push origin HEAD:refs/heads/granada/focus-clock-first-classical-completion-20261124
